name: WeStudy QA Chatbot
description: WeStudyコミュニティ情報Q&AチャットボットのバックエンドAPI
api:
  # 外部 HTTP は登録 API に埋め込まない（失敗時の全体 500 回避）。通知は専用 API を使う。
  # __NOTIFY_*__ は publish_raimo_1346.py が .env.jarvis_private の NOTIFY_* から注入する。
  - name: registerUser
    endpoint: POST /auth/register
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - check:
          condition: "input.member_no != ''"
          errorCode: "member_no_required"
          errorMessage: "'会員番号は必須です'"
      - check:
          condition: "input.name != ''"
          errorCode: "name_required"
          errorMessage: "'氏名は必須です'"
      - tableInsert:
          table: users
          data:
            email: "input.email"
            password_hash: "input.password_hash"
            member_no: "input.member_no"
            name: "input.name"
            role: "'user'"
            status: "'pending'"
        as: user
    output:
      id: "inserted.user"

  # Phase 1: 承認依頼メール通知（GAS）。register とは分離。Phase 2 で登録成功後に呼ぶ。
  - name: notifyRegistration
    endpoint: POST /notify/registration
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - api:
          url: "__NOTIFY_WEBHOOK_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
          body:
            secret: "'__NOTIFY_SHARED_SECRET__'"
            email: "input.email"
            member_no: "input.member_no"
            registered_at: "input.registered_at"
            note: "input.note"
        as: gas
    output:
      ok: "'true'"

  # Phase 3: 承認完了メール（申請者宛）。approve API とは分離。
  - name: notifyApproval
    endpoint: POST /notify/approval
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - api:
          url: "__NOTIFY_WEBHOOK_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
          body:
            secret: "'__NOTIFY_SHARED_SECRET__'"
            type: "'approval'"
            email: "input.email"
        as: gas
    output:
      ok: "'true'"

  # Phase 8: 却下メール（申請者宛）。reject API とは分離。
  - name: notifyRejection
    endpoint: POST /notify/rejection
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - api:
          url: "__NOTIFY_WEBHOOK_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
          body:
            secret: "'__NOTIFY_SHARED_SECRET__'"
            type: "'rejection'"
            email: "input.email"
        as: gas
    output:
      ok: "'true'"

  # Phase 4: パスワード再設定メール（申請者宛）。issue API とは分離。
  - name: notifyPasswordReset
    endpoint: POST /notify/password-reset
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - check:
          condition: "input.reset_url != ''"
          errorCode: "reset_url_required"
          errorMessage: "'再設定URLは必須です'"
      - api:
          url: "__NOTIFY_WEBHOOK_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
          body:
            secret: "'__NOTIFY_SHARED_SECRET__'"
            type: "'password_reset'"
            email: "input.email"
            reset_url: "input.reset_url"
            expires_at: "input.expires_at"
        as: gas
    output:
      ok: "'true'"

  # マスター移譲依頼メール（指名された管理者宛）
  - name: notifyMasterTransfer
    endpoint: POST /notify/master-transfer
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - check:
          condition: "input.approval_url != ''"
          errorCode: "approval_url_required"
          errorMessage: "'承認URLは必須です'"
      - api:
          url: "__NOTIFY_WEBHOOK_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
          body:
            secret: "'__NOTIFY_SHARED_SECRET__'"
            type: "'master_transfer'"
            email: "input.email"
            approval_url: "input.approval_url"
            from_email: "input.from_email"
            expires_at: "input.expires_at"
        as: gas
    output:
      ok: "'true'"

  # 初期マスター設定（1回限り運用想定）。NOTIFY 共有シークレットで保護。
  - name: bootstrapMasterByEmail
    endpoint: POST /admin/bootstrap-master
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - check:
          condition: "input.secret == '__NOTIFY_SHARED_SECRET__'"
          errorCode: "invalid_secret"
          errorMessage: "'シークレットが一致しません'"
      - tableUpdate:
          table: users
          set:
            role: "'master_admin'"
            status: "'approved'"
          where:
            email: "input.email"
      - tableFetchOne:
          table: users
          where:
            email: "input.email"
        as: user
      - check:
          condition: "fetched.user != null"
          errorCode: "user_not_found"
          errorMessage: "'対象ユーザーが見つかりません'"
    output:
      success: "'true'"
      user: "fetched.user"

  - name: listPendingUsers
    endpoint: GET /admin/users/pending
    steps:
      - tableFetchMany:
          table: users
          where:
            status: "'pending'"
        as: users
    output:
      users: "fetched.users"

  # 承認済みユーザー（一般＋管理者）。フロントで role により一覧を振り分ける。
  - name: listApprovedUsers
    endpoint: GET /admin/users
    steps:
      - tableFetchMany:
          table: users
          where:
            status: "'approved'"
        as: users
    output:
      users: "fetched.users"

  # 通常管理者: 昇格/剥奪の申請（comments にメタ行を積む。comment_id=admin_role_req_{targetId}）
  - name: createRoleRequest
    endpoint: POST /admin/users/{id}/role-requests
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'申請者IDは必須です'"
      - check:
          condition: "input.comment_id != ''"
          errorCode: "comment_id_required"
          errorMessage: "'comment_id は必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null"
          errorCode: "actor_not_found"
          errorMessage: "'申請者が見つかりません'"
      - check:
          condition: "fetched.actor.role != 'user'"
          errorCode: "forbidden"
          errorMessage: "'管理者のみ申請できます'"
      - tableFetchOne:
          table: users
          where:
            id: "path.id"
        as: target
      - check:
          condition: "fetched.target != null"
          errorCode: "user_not_found"
          errorMessage: "'対象ユーザーが見つかりません'"
      - check:
          condition: "fetched.target.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'承認済みユーザーのみ対象にできます'"
      - check:
          condition: "fetched.target.role != 'master_admin'"
          errorCode: "cannot_change_master"
          errorMessage: "'マスター管理者は変更できません'"
      # Raimo comments 実列のみ（topic_title 等は未作成のため使わない）。
      # action は parent_comment_id に grant|revoke を格納。
      - tableInsert:
          table: comments
          data:
            comment_id: "input.comment_id"
            content: "input.content"
            author_name: "input.actor_user_id"
            author_email: "input.actor_email"
            posted_at: "input.requested_at"
            parent_comment_id: "input.action"
            source_type: "'__admin_meta__'"
        as: req
    output:
      success: "'true'"

  - name: listPendingRoleRequests
    endpoint: GET /admin/role-requests/pending
    steps:
      - tableFetchMany:
          table: comments
          whereRaw:
            sql: "comment_id LIKE 'admin_role_req_%'"
            params: []
        as: requests
    output:
      requests: "fetched.requests"

  - name: approveRoleRequest
    endpoint: PUT /admin/role-requests/{id}/approve
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null && fetched.actor.role == 'master_admin'"
          errorCode: "forbidden"
          errorMessage: "'マスター管理者のみ承認できます'"
      - tableFetchOne:
          table: users
          where:
            id: "path.id"
        as: target
      - check:
          condition: "fetched.target != null"
          errorCode: "user_not_found"
          errorMessage: "'対象ユーザーが見つかりません'"
      - check:
          condition: "fetched.target.role != 'master_admin'"
          errorCode: "cannot_change_master"
          errorMessage: "'マスター管理者は変更できません'"
      - tableUpdate:
          table: users
          set:
            role: "input.new_role"
          where:
            id: "path.id"
      - tableDelete:
          table: comments
          where:
            comment_id: "input.comment_id"
    output:
      success: "'true'"

  - name: rejectRoleRequest
    endpoint: PUT /admin/role-requests/{id}/reject
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null && fetched.actor.role == 'master_admin'"
          errorCode: "forbidden"
          errorMessage: "'マスター管理者のみ却下できます'"
      - tableDelete:
          table: comments
          where:
            comment_id: "input.comment_id"
    output:
      success: "'true'"

  # マスター即時: role を admin / user に設定
  - name: setUserRole
    endpoint: POST /admin/users/{id}/set-role
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - check:
          condition: "input.role != ''"
          errorCode: "invalid_role"
          errorMessage: "'role は必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null && fetched.actor.role == 'master_admin'"
          errorCode: "forbidden"
          errorMessage: "'マスター管理者のみ即時変更できます'"
      - tableFetchOne:
          table: users
          where:
            id: "path.id"
        as: target
      - check:
          condition: "fetched.target != null"
          errorCode: "user_not_found"
          errorMessage: "'対象ユーザーが見つかりません'"
      - check:
          condition: "fetched.target.role != 'master_admin'"
          errorCode: "cannot_change_master"
          errorMessage: "'マスター管理者は変更できません'"
      - tableUpdate:
          table: users
          set:
            role: "input.role"
          where:
            id: "path.id"
    output:
      success: "'true'"

  # 退会（ソフト削除）。履歴は残し status=withdrawn。
  - name: withdrawUser
    endpoint: PUT /admin/users/{id}/withdraw
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null && fetched.actor.role != 'user'"
          errorCode: "forbidden"
          errorMessage: "'管理者のみ退会処理できます'"
      - tableFetchOne:
          table: users
          where:
            id: "path.id"
        as: target
      - check:
          condition: "fetched.target != null"
          errorCode: "user_not_found"
          errorMessage: "'対象ユーザーが見つかりません'"
      - check:
          condition: "fetched.target.role != 'master_admin'"
          errorCode: "cannot_withdraw_master"
          errorMessage: "'マスター管理者は退会処理できません'"
      - tableUpdate:
          table: users
          set:
            status: "'withdrawn'"
            role: "'user'"
          where:
            id: "path.id"
    output:
      success: "'true'"

  # マスター移譲: 開始（現マスターのみ）。comments メタ行 comment_id=admin_master_xfer_pending
  # content=token / author_name=from_id / parent_comment_id=to_id / author_email=to_email / posted_at=expires
  # 既存 pending の削除はフロントが cancel を先に呼ぶ（同一API内の delete→insert は失敗しやすい）
  # マスター移譲: 開始（現マスターのみ）。comments メタ行 comment_id=admin_master_xfer_pending
  # content=token / author_name=from_id / parent_comment_id=to_id / author_email=to_email / posted_at=expires
  # 注意: comments.posted_at は ISO Z（…Z）不可。+09:00 または "YYYY-MM-DD HH:mm:ss" を使う。
  # 既存 pending の削除はフロントが cancel を先に呼ぶ。
  - name: startMasterTransfer
    endpoint: POST /admin/master-transfer/start
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - check:
          condition: "input.target_user_id != ''"
          errorCode: "target_required"
          errorMessage: "'移譲先ユーザーIDは必須です'"
      - check:
          condition: "input.token != ''"
          errorCode: "token_required"
          errorMessage: "'token は必須です'"
      - check:
          condition: "input.comment_id != ''"
          errorCode: "comment_id_required"
          errorMessage: "'comment_id は必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null"
          errorCode: "actor_not_found"
          errorMessage: "'実行者が見つかりません'"
      - check:
          condition: "fetched.actor.role == 'master_admin'"
          errorCode: "forbidden"
          errorMessage: "'マスター管理者のみ移譲を開始できます'"
      - tableFetchOne:
          table: users
          where:
            id: "input.target_user_id"
        as: target
      - check:
          condition: "fetched.target != null"
          errorCode: "user_not_found"
          errorMessage: "'移譲先ユーザーが見つかりません'"
      - check:
          condition: "fetched.target.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'承認済みユーザーのみ移譲先にできます'"
      - check:
          condition: "fetched.target.role == 'admin'"
          errorCode: "target_not_admin"
          errorMessage: "'移譲先は通常の管理者である必要があります'"
      - tableInsert:
          table: comments
          data:
            comment_id: "input.comment_id"
            content: "input.token"
            author_name: "input.actor_user_id"
            author_email: "input.target_email"
            parent_comment_id: "input.target_user_id"
            posted_at: "input.expires_at"
            ip_address: "input.from_email"
            source_type: "'__master_xfer__'"
        as: xfer
    output:
      success: "'true'"

  - name: getPendingMasterTransfer
    endpoint: GET /admin/master-transfer/pending
    steps:
      - tableFetchOne:
          table: comments
          where:
            comment_id: "'admin_master_xfer_pending'"
        as: request
    output:
      request: "fetched.request"

  - name: validateMasterTransfer
    endpoint: POST /admin/master-transfer/validate
    steps:
      - check:
          condition: "input.token != ''"
          errorCode: "token_required"
          errorMessage: "'token は必須です'"
      - tableFetchOne:
          table: comments
          where:
            comment_id: "'admin_master_xfer_pending'"
        as: request
      - check:
          condition: "fetched.request != null"
          errorCode: "not_found"
          errorMessage: "'有効なマスター移譲依頼がありません'"
      - check:
          condition: "fetched.request.content == input.token"
          errorCode: "invalid_token"
          errorMessage: "'移譲リンクが無効です'"
    output:
      from_user_id: "fetched.request.author_name"
      to_user_id: "fetched.request.parent_comment_id"
      to_email: "fetched.request.author_email"
      from_email: "fetched.request.ip_address"
      expires_at: "fetched.request.posted_at"

  # 指名された管理者が承認 → 元マスターは admin、指名者は master_admin
  - name: acceptMasterTransfer
    endpoint: POST /admin/master-transfer/accept
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - check:
          condition: "input.token != ''"
          errorCode: "token_required"
          errorMessage: "'token は必須です'"
      - check:
          condition: "input.from_user_id != ''"
          errorCode: "from_required"
          errorMessage: "'from_user_id は必須です'"
      - tableFetchOne:
          table: comments
          where:
            comment_id: "'admin_master_xfer_pending'"
        as: request
      - check:
          condition: "fetched.request != null"
          errorCode: "not_found"
          errorMessage: "'有効なマスター移譲依頼がありません'"
      - check:
          condition: "fetched.request.content == input.token"
          errorCode: "invalid_token"
          errorMessage: "'移譲リンクが無効です'"
      - check:
          condition: "fetched.request.parent_comment_id == input.actor_user_id"
          errorCode: "not_nominee"
          errorMessage: "'指名された管理者のみ承認できます'"
      - check:
          condition: "fetched.request.author_name == input.from_user_id"
          errorCode: "from_mismatch"
          errorMessage: "'移譲元情報が一致しません'"
      - tableUpdate:
          table: users
          set:
            role: "'master_admin'"
          where:
            id: "input.actor_user_id"
      - tableUpdate:
          table: users
          set:
            role: "'admin'"
          where:
            id: "input.from_user_id"
      - tableDelete:
          table: comments
          where:
            comment_id: "'admin_master_xfer_pending'"
    output:
      success: "'true'"

  - name: cancelMasterTransfer
    endpoint: POST /admin/master-transfer/cancel
    steps:
      - check:
          condition: "input.actor_user_id != ''"
          errorCode: "actor_required"
          errorMessage: "'実行者IDは必須です'"
      - tableFetchOne:
          table: users
          where:
            id: "input.actor_user_id"
        as: actor
      - check:
          condition: "fetched.actor != null && fetched.actor.role == 'master_admin'"
          errorCode: "forbidden"
          errorMessage: "'マスター管理者のみキャンセルできます'"
      - tableDelete:
          table: comments
          where:
            comment_id: "'admin_master_xfer_pending'"
    output:
      success: "'true'"

  - name: approveUser
    endpoint: PUT /admin/users/{id}/approve
    steps:
      - tableUpdate:
          table: users
          set:
            status: "'approved'"
          where:
            id: "path.id"
    output:
      success: "'true'"

  # Phase 8: 却下（行は残し status=rejected）
  - name: rejectUser
    endpoint: PUT /admin/users/{id}/reject
    steps:
      - tableUpdate:
          table: users
          set:
            status: "'rejected'"
          where:
            id: "path.id"
    output:
      success: "'true'"

  - name: login
    endpoint: POST /auth/login
    steps:
      - tableFetchOne:
          table: users
          where:
            email: "input.email"
            password_hash: "input.password_hash"
        as: user
      - check:
          condition: "fetched.user != null"
          errorCode: "invalid_credentials"
          errorMessage: "'メールアドレスまたはパスワードが間違っています'"
      - check:
          condition: "fetched.user.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'管理者の承認待ちです。申請が却下された場合は届いたメールをご確認ください'"
    output:
      user: "fetched.user"

  # Phase 4: パスワード再設定（1）メール確認（未登録文言を要件どおり）
  - name: checkResetPasswordEmail
    endpoint: POST /auth/reset-password/check
    steps:
      - tableFetchOne:
          table: users
          where:
            email: "input.email"
        as: user
      - check:
          condition: "fetched.user != null"
          errorCode: "user_not_found"
          errorMessage: "'登録されたメールアドレスを入力してください'"
      - check:
          condition: "fetched.user.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'まだ管理者の承認待ちです。承認後にパスワードを再設定できます'"
    output:
      email: "fetched.user.email"

  # Phase 4: トークン発行（フロントが UUID を生成して渡す）
  - name: issueForgotPasswordToken
    endpoint: POST /auth/forgot-password/issue
    steps:
      - check:
          condition: "input.email != ''"
          errorCode: "email_required"
          errorMessage: "'メールアドレスは必須です'"
      - check:
          condition: "input.token != ''"
          errorCode: "token_required"
          errorMessage: "'トークンは必須です'"
      - check:
          condition: "input.expires_at != ''"
          errorCode: "expires_required"
          errorMessage: "'有効期限は必須です'"
      - tableFetchOne:
          table: users
          where:
            email: "input.email"
        as: user
      - check:
          condition: "fetched.user != null"
          errorCode: "user_not_found"
          errorMessage: "'登録されたメールアドレスを入力してください'"
      - check:
          condition: "fetched.user.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'まだ管理者の承認待ちです。承認後にパスワードを再設定できます'"
      - tableUpdate:
          table: users
          set:
            reset_token: "input.token"
            reset_expires_at: "input.expires_at"
          where:
            email: "input.email"
    output:
      email: "input.email"
      success: "'true'"

  # Phase 4: トークン検証（有効期限の大小比較は Raimo DSL 非対応のためフロントで判定）
  - name: validateForgotPasswordToken
    endpoint: POST /auth/forgot-password/validate
    steps:
      - check:
          condition: "input.token != ''"
          errorCode: "token_required"
          errorMessage: "'トークンは必須です'"
      - tableFetchOne:
          table: users
          where:
            reset_token: "input.token"
        as: user
      - check:
          condition: "fetched.user != null"
          errorCode: "invalid_token"
          errorMessage: "'再設定リンクが無効です。もう一度メールアドレスからやり直してください'"
      - check:
          condition: "fetched.user.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'まだ管理者の承認待ちです。承認後にパスワードを再設定できます'"
    output:
      email: "fetched.user.email"
      token: "input.token"
      expires_at: "fetched.user.reset_expires_at"

  # Phase 4: 新パスワード保存（token 必須。email だけでは不可）
  - name: resetPassword
    endpoint: POST /auth/reset-password
    steps:
      - check:
          condition: "input.token != ''"
          errorCode: "token_required"
          errorMessage: "'トークンは必須です'"
      - check:
          condition: "input.password_hash != ''"
          errorCode: "password_required"
          errorMessage: "'新しいパスワードは必須です'"
      - tableFetchOne:
          table: users
          where:
            reset_token: "input.token"
        as: user
      - check:
          condition: "fetched.user != null"
          errorCode: "invalid_token"
          errorMessage: "'再設定リンクが無効です。もう一度メールアドレスからやり直してください'"
      - check:
          condition: "fetched.user.status == 'approved'"
          errorCode: "not_approved"
          errorMessage: "'まだ管理者の承認待ちです。承認後にパスワードを再設定できます'"
      - tableUpdate:
          table: users
          set:
            password_hash: "input.password_hash"
            reset_token: "''"
            reset_expires_at: "''"
          where:
            reset_token: "input.token"
    output:
      success: "'true'"
      email: "fetched.user.email"

  # Raimo comments 実列のみ insert（未作成列を入れると 400）。
  # source_system / topic_title / course_* / content_hash 等はポータルで列追加後に復活可。
  - name: createComment
    endpoint: POST /admin/comments
    steps:
      - tableInsert:
          table: comments
          data:
            source_type: "input.source_type"
            comment_id: "input.comment_id"
            posted_at: "input.posted_at"
            author_name: "input.author_name"
            author_email: "input.author_email"
            content: "input.content"
            parent_comment_id: "input.parent_comment_id"
            ip_address: "input.ip_address"
            user_agent: "input.user_agent"
        as: comment
    output:
      id: "inserted.comment"

  # 既存行の分類メタ更新（DBに forum_category 等の列がある環境向け。無い場合は UI lookup を正とする）
  - name: updateCommentCategory
    endpoint: POST /admin/comments/update-category
    steps:
      - tableUpdate:
          table: comments
          where:
            comment_id: "input.comment_id"
          data:
            source_type: "input.source_type"
            source_system: "input.source_system"
            source_kind: "input.source_kind"
            forum_category: "input.forum_category"
            topic_title: "input.topic_title"
        as: updated
    output:
      success: "'true'"

  # 本文が短い／切れている既存行の上書き（品質修復用）。lesson メタ列も合わせて更新。
  - name: updateCommentContent
    endpoint: POST /admin/comments/update-content
    steps:
      - tableUpdate:
          table: comments
          where:
            comment_id: "input.comment_id"
          data:
            content: "input.content"
            posted_at: "input.posted_at"
            author_name: "input.author_name"
            author_email: "input.author_email"
            source_type: "input.source_type"
            source_system: "input.source_system"
            source_kind: "input.source_kind"
            forum_category: "input.forum_category"
            topic_title: "input.topic_title"
            parent_comment_id: "input.parent_comment_id"
            course_tab: "input.course_tab"
            section_name: "input.section_name"
            lesson_title: "input.lesson_title"
            lesson_url: "input.lesson_url"
            content_hash: "input.content_hash"
        as: updated
    output:
      success: "'true'"

  - name: updateCommentPostedAt
    endpoint: POST /admin/comments/update-posted-at
    steps:
      - tableUpdate:
          table: comments
          where:
            comment_id: "input.comment_id"
          data:
            posted_at: "input.posted_at"
        as: updated
    output:
      success: "'true'"

  - name: listComments
    endpoint: GET /comments
    steps:
      - tableFetchMany:
          table: comments
          orderBy: "posted_at DESC"
          limit: 50000
        as: comments
    output:
      comments: "fetched.comments"

  # 物理削除（1行ずつ）。DELETE+JSON は環境によって input が空になり 500 になりやすいため POST に統一。
  # 一括 tableDelete は行数・エンジン制限で 500 になり得るため、フロントは複数回この API を呼ぶ。
  - name: deleteCommentById
    endpoint: POST /admin/comments/{id}/delete
    steps:
      - tableDelete:
          table: comments
          where:
            id: "path.id"
    output:
      success: "'true'"

  - name: createChatSession
    endpoint: POST /chat-sessions
    steps:
      # Phase12: タイトルは input.initial_message をそのまま使用
      # （Raimo の calculate で文字列結合 `+` を使うと式が壊れるため使わない）
      - tableInsert:
          table: chat_sessions
          data:
            user_id: "input.user_id"
            title: "input.initial_message"
        as: session
    output:
      id: "inserted.session"
      title: "input.initial_message"

  # 意味検索用: ユーザー／アシスタントメッセージを1件追加（要約はフロント→Edge直呼び）
  - name: appendChatMessage
    endpoint: POST /chat-sessions/{id}/messages-append
    steps:
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "input.role"
            content: "input.content"
        as: appendedMessage
    output:
      ok: "'true'"

  - name: listChatSessionsByUser
    endpoint: GET /users/{id}/chat-sessions
    steps:
      - tableFetchMany:
          table: chat_sessions
          where:
            user_id: "path.id"
          orderBy: "updated_at DESC"
        as: sessions
    output:
      sessions: "fetched.sessions"

  # 履歴を最上へ（再利用・再検索時）。updated_at を更新して一覧順を上げる
  - name: touchChatSession
    endpoint: PUT /chat-sessions/{id}/touch
    steps:
      - tableFetchOne:
          table: chat_sessions
          where:
            id: "path.id"
        as: session
      - tableUpdate:
          table: chat_sessions
          set:
            title: "fetched.session.title"
          where:
            id: "path.id"
    output:
      id: "path.id"
      title: "fetched.session.title"

  - name: getChatSessionDetails
    endpoint: GET /chat-sessions/{id}
    steps:
      - tableFetchOne:
          table: chat_sessions
          where:
            id: "path.id"
        as: session
      - tableFetchMany:
          table: chat_messages
          where:
            session_id: "path.id"
          orderBy: "created_at ASC"
        as: messages
    output:
      session: "fetched.session"
      messages: "fetched.messages"

  - name: sendMessage
    endpoint: POST /chat-sessions/{id}/messages
    steps:
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'user'"
            content: "input.content"
        as: userMessage
      - llm:
          model: "gemini-3-flash-preview"
          prompt: "'次の質問から、データベース検索用の重要なキーワードを1つだけ抽出してください。キーワードのみを出力してください: ' + input.content"
        as: keyword
      - tableFetchMany:
          table: comments
          whereRaw:
            sql: "content LIKE CONCAT('%', ?, '%') AND (comment_id NOT LIKE 'lesson_desc_%')"
            params:
              - "llm.keyword"
          orderBy: "posted_at DESC"
          limit: 80
        as: relatedCommunityComments
      - tableFetchMany:
          table: comments
          whereRaw:
            sql: "content LIKE CONCAT('%', ?, '%') AND (comment_id LIKE 'lesson_desc_%')"
            params:
              - "llm.keyword"
          orderBy: "posted_at DESC"
          limit: 40
        as: relatedLessonComments
      - tableFetchMany:
          table: knowledge_chunks
          whereRaw:
            sql: "content LIKE CONCAT('%', ?, '%')"
            params:
              - "llm.keyword"
          limit: 50
        as: relatedChunks
      # Phase12: knowledge_sources 500件一括取得を廃止（LLMプロンプト肥大化と遅延の主因）
      - calculate:
          expression: "'あなたは神・大家さん倶楽部の情報Q&Aアシスタントです。与えられた参考情報だけを根拠に、日本語で簡潔に答えてください。推測で事実を足さないこと。地域・物件種別・融資・収支・注意点など、質問のテーマに関係する記述があれば、それを要約して答えてください（完全一致の見出しがなくても可）。足りない点だけ『参照内では触れられていない』と補足してください。参考が空、または質問テーマと全く無関係なときだけ『参照内で確証が取れないため、お答えすることができません。』と書いてください。根拠の列挙（出典・コミュニティ・学習ページ説明・セミナー一覧）は画面UIが表示するため、回答本文には出典見出しやコミュニティ／学習ページ／セミナーの列挙を書かないでください。\\n\\n参考コミュニティ(JSON): ' + fetched.relatedCommunityComments + '\\n\\n参考学習ページ説明(JSON): ' + fetched.relatedLessonComments + '\\n\\n参考セミナー動画チャンク(JSON): ' + fetched.relatedChunks + '\\n\\n質問: ' + input.content"
        as: promptText
      - llm:
          model: "gemini-3-flash-preview"
          prompt: "computed.promptText"
        as: answer
      - calculate:
          expression: "'あなたは根拠ID抽出器です。次の「回答」が実際に根拠にした情報だけを選び、JSONのみを1つ出力してください。形式は厳密に {\"comment_ids\":[\"...\"],\"chunk_keys\":[\"...\"]}。comment_ids には参考コミュニティJSONおよび参考学習ページ説明JSONの comment_id（または commentId）だけを文字列で。chunk_keys には参考チャンクJSONの chunk_key だけを。使っていないIDは入れない。該当がなければ空配列。説明・Markdown・コードフェンス禁止。\\n\\n回答:\\n' + llm.answer + '\\n\\n参考コミュニティ(JSON):\\n' + fetched.relatedCommunityComments + '\\n\\n参考学習ページ説明(JSON):\\n' + fetched.relatedLessonComments + '\\n\\n参考チャンク(JSON):\\n' + fetched.relatedChunks"
        as: usedSourcesPrompt
      - llm:
          model: "gemini-3-flash-preview"
          prompt: "computed.usedSourcesPrompt"
        as: usedSources
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'assistant'"
            content: "llm.answer"
        as: assistantMessage
    output:
      answer: "llm.answer"
      usedSources: "llm.usedSources"
      relatedComments: "fetched.relatedCommunityComments"
      relatedLessonComments: "fetched.relatedLessonComments"
      relatedChunks: "fetched.relatedChunks"
      relatedSources: "[]"

  # Phase12: 準拠抽出LLMを省略する高速経路（フロントのオプトインから呼ぶ）
  - name: sendMessageFast
    endpoint: POST /chat-sessions/{id}/messages-fast
    steps:
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'user'"
            content: "input.content"
        as: userMessage
      - llm:
          model: "gemini-3-flash-preview"
          prompt: "'次の質問から、データベース検索用の重要なキーワードを1つだけ抽出してください。キーワードのみを出力してください: ' + input.content"
        as: keyword
      - tableFetchMany:
          table: comments
          whereRaw:
            sql: "content LIKE CONCAT('%', ?, '%') AND (comment_id NOT LIKE 'lesson_desc_%')"
            params:
              - "llm.keyword"
          orderBy: "posted_at DESC"
          limit: 80
        as: relatedCommunityComments
      - tableFetchMany:
          table: comments
          whereRaw:
            sql: "content LIKE CONCAT('%', ?, '%') AND (comment_id LIKE 'lesson_desc_%')"
            params:
              - "llm.keyword"
          orderBy: "posted_at DESC"
          limit: 40
        as: relatedLessonComments
      - tableFetchMany:
          table: knowledge_chunks
          whereRaw:
            sql: "content LIKE CONCAT('%', ?, '%')"
            params:
              - "llm.keyword"
          limit: 50
        as: relatedChunks
      - calculate:
          expression: "'あなたは神・大家さん倶楽部の情報Q&Aアシスタントです。与えられた参考情報だけを根拠に、日本語で簡潔に答えてください。推測で事実を足さないこと。地域・物件種別・融資・収支・注意点など、質問のテーマに関係する記述があれば、それを要約して答えてください（完全一致の見出しがなくても可）。足りない点だけ『参照内では触れられていない』と補足してください。参考が空、または質問テーマと全く無関係なときだけ『参照内で確証が取れないため、お答えすることができません。』と書いてください。根拠の列挙（出典・コミュニティ・学習ページ説明・セミナー一覧）は画面UIが表示するため、回答本文には出典見出しやコミュニティ／学習ページ／セミナーの列挙を書かないでください。\\n\\n参考コミュニティ(JSON): ' + fetched.relatedCommunityComments + '\\n\\n参考学習ページ説明(JSON): ' + fetched.relatedLessonComments + '\\n\\n参考セミナー動画チャンク(JSON): ' + fetched.relatedChunks + '\\n\\n質問: ' + input.content"
        as: promptText
      - llm:
          model: "gemini-3-flash-preview"
          prompt: "computed.promptText"
        as: answer
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'assistant'"
            content: "llm.answer"
        as: assistantMessage
    output:
      answer: "llm.answer"
      usedSources: "''"
      relatedComments: "fetched.relatedCommunityComments"
      relatedLessonComments: "fetched.relatedLessonComments"
      relatedChunks: "fetched.relatedChunks"
      relatedSources: "[]"

  # 意味検索: 共有シークレットは YAML リテラルで返す（apiネスト参照は使えない）。
  # 本文検索・要約はブラウザが Edge を直呼びする。
  - name: semanticSearchConfig
    endpoint: POST /semantic-search-config
    steps:
      - calculate:
          expression: "'ok'"
        as: ping
    output:
      url: "'__SEMANTIC_SEARCH_URL__'"
      secret: "'__SEMANTIC_SEARCH_SHARED_SECRET__'"
      ping: "calculated.ping"

  - name: sendMessageSemantic
    endpoint: POST /chat-sessions/{id}/messages-semantic
    steps:
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'user'"
            content: "input.content"
        as: userMessage
      # 要約は Edge Function 側で完結（Raimo の api→llm プロンプト結合が空参照になり拒否回答になる問題を回避）
      - api:
          url: "__SEMANTIC_SEARCH_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
            X-Semantic-Shared-Secret: "__SEMANTIC_SEARCH_SHARED_SECRET__"
          body:
            query: "input.content"
            comment_limit: "100"
            chunk_limit: "50"
            match_threshold: "0.22"
        as: semanticResults
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'assistant'"
            content: "fetched.semanticResults.answer"
        as: semanticAssistantMessage
    output:
      answer: "fetched.semanticResults.answer"
      usedSources: "fetched.semanticResults.usedSources"
      relatedComments: "fetched.semanticResults.relatedComments"
      relatedChunks: "fetched.semanticResults.relatedChunks"
      relatedSources: "fetched.semanticResults.relatedSources"

  - name: sendMessageSemanticFast
    endpoint: POST /chat-sessions/{id}/messages-semantic-fast
    steps:
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'user'"
            content: "input.content"
        as: userMessage
      - api:
          url: "__SEMANTIC_SEARCH_URL__"
          method: "POST"
          headers:
            Content-Type: "application/json"
            X-Semantic-Shared-Secret: "__SEMANTIC_SEARCH_SHARED_SECRET__"
          body:
            query: "input.content"
            comment_limit: "100"
            chunk_limit: "50"
            match_threshold: "0.22"
        as: semanticResults
      - tableInsert:
          table: chat_messages
          data:
            session_id: "path.id"
            role: "'assistant'"
            content: "fetched.semanticResults.answer"
        as: semanticAssistantMessage
    output:
      answer: "fetched.semanticResults.answer"
      usedSources: "fetched.semanticResults.usedSources"
      relatedComments: "fetched.semanticResults.relatedComments"
      relatedChunks: "fetched.semanticResults.relatedChunks"
      relatedSources: "fetched.semanticResults.relatedSources"

  - name: listKnowledgeChunks
    endpoint: GET /knowledge-chunks
    steps:
      - tableFetchMany:
          table: knowledge_chunks
          orderBy: "start_sec ASC"
          limit: 20000
        as: chunks
    output:
      chunks: "fetched.chunks"

  - name: listKnowledgeSources
    endpoint: GET /knowledge-sources
    steps:
      - tableFetchMany:
          table: knowledge_sources
          orderBy: "id DESC"
          limit: 5000
        as: sources
    output:
      sources: "fetched.sources"

  - name: upsertKnowledgeSource
    endpoint: POST /admin/knowledge-sources
    steps:
      - tableInsert:
          table: knowledge_sources
          data:
            source_key: "input.source_key"
            source_kind: "input.source_kind"
            content_channel: "input.content_channel"
            title: "input.title"
            video_id: "input.video_id"
            video_url: "input.video_url"
            instructor: "input.instructor"
            origin_path: "input.origin_path"
            meta_json: "input.meta_json"
            ingest_status: "input.ingest_status"
        as: source
    output:
      id: "inserted.source"

  # 既存 source_key の上書き（再ミラー時）。INSERT の unique 衝突回避用。
  - name: updateKnowledgeSource
    endpoint: POST /admin/knowledge-sources/update
    steps:
      - tableUpdate:
          table: knowledge_sources
          set:
            source_kind: "input.source_kind"
            content_channel: "input.content_channel"
            title: "input.title"
            video_id: "input.video_id"
            video_url: "input.video_url"
            instructor: "input.instructor"
            origin_path: "input.origin_path"
            meta_json: "input.meta_json"
            ingest_status: "input.ingest_status"
          where:
            source_key: "input.source_key"
    output:
      success: "'true'"

  - name: upsertKnowledgeChunk
    endpoint: POST /admin/knowledge-chunks
    steps:
      - tableInsert:
          table: knowledge_chunks
          data:
            chunk_key: "input.chunk_key"
            source_key: "input.source_key"
            start_sec: "input.start_sec"
            end_sec: "input.end_sec"
            speaker: "input.speaker"
            content: "input.content"
            search_text: "input.search_text"
        as: chunk
    output:
      id: "inserted.chunk"

  # 再ミラー前に同一 source_key のチャンクを消す（重複防止）。件数が多いと 500 のことがある。
  - name: deleteKnowledgeChunksBySource
    endpoint: POST /admin/knowledge-chunks/delete-by-source
    steps:
      - tableDelete:
          table: knowledge_chunks
          where:
            source_key: "input.source_key"
    output:
      success: "'true'"

  - name: listSuggestedQuestions
    endpoint: GET /suggested-questions
    steps:
      - tableFetchMany:
          table: suggested_questions
          orderBy: "frequency DESC"
          limit: 5
        as: questions
    output:
      questions: "fetched.questions"

  - name: incrementSuggestedQuestionFrequency
    endpoint: PUT /suggested-questions/{id}/increment
    steps:
      - tableFetchOne:
          table: suggested_questions
          where:
            id: "path.id"
        as: question
      - calculate:
          expression: "fetched.question.frequency + 1"
        as: newFrequency
      - tableUpdate:
          table: suggested_questions
          set:
            frequency: "computed.newFrequency"
          where:
            id: "path.id"
    output:
      success: "'true'"

  - name: createSuggestedQuestion
    endpoint: POST /suggested-questions
    steps:
      - tableInsert:
          table: suggested_questions
          data:
            question_text: "input.question_text"
            frequency: 1
        as: question
    output:
      id: "inserted.question"
