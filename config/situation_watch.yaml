# Jarvis 状況ウォッチ — レジストリ（Phase 0）
# 集約: scripts/jarvis_situation_watch.py → .jarvis_state/situation_watch.json
# 判定は既存 state JSON を読むのみ（新規ログインなし）

version: 1

# popup_levels: 起動時ポップアップに含める判定レベル
popup_levels:
  - attention
  - warn

items:
  - id: energy_cf
    title: 電力・太陽光キャッシュフロー
    category: finance
    enabled: true
    source: .jarvis_state/energy_cf.json
    cursor_prompt: |
      電力・太陽光の収支を確認して。state は ~/git-repos/.jarvis_state/energy_cf.json。
      設定: config/energy_cf.yaml。収集: scripts/jarvis_energy_cf_collect.py [--push]。
      買電=エネワン（サイサン）、売電=中部電力PG、ローン=オリコ。kWh 欠落や FIT 改定注意があれば報告して。

  - id: etc_mileage
    title: ETC月次（明細・還元）
    category: finance
    enabled: true
    source: .jarvis_state/etc_monthly.json
    cursor_prompt: |
      ETC月次の状況を確認して。state は ~/git-repos/.jarvis_state/etc_monthly.json。
      ルール: jarvis-monthly-routine.mdc / etc-discount-jarvis.mdc。
      ウィンドウA（1〜8日）・B（19〜26日）の未実施があれば実行して報告して。

  - id: vpoint
    title: Vポイント（cadence・月次）
    category: finance
    enabled: true
    source: .jarvis_state/vpoint_cadence.json
    cursor_prompt: |
      Vポイントの状況を確認して。cadence・月次・監査結果を見て、
      open_actions の次の一手があれば提案して。
      定期払いチャンス（テイチャン）も .jarvis_state/teiki_barai_chance.json を見て、
      抽選券があれば scripts/jarvis_teiki_barai_chance.py --run で回して通知して。
      ルール: jarvis-vpoint-audit.mdc。state: .jarvis_state/vpoint_*.json / teiki_barai_chance.json

  - id: rent_step
    title: Grandole家賃ステップ（+4,000）
    category: finance
    enabled: true
    source: .jarvis_state/rent_step_monthly.json
    cursor_prompt: |
      Grandole の家賃ステップアップ（入居1年 +4,000）を確認して。
      state: .jarvis_state/rent_step_monthly.json / config/rent_step_up.yaml
      コマンド: scripts/jarvis_rent_step_monthly_check.py --mark-done
      未反映・変動があれば /rent-step と家賃マップ更新を案内して。

  - id: card_annual_fee
    title: カード年会費（Olive / PP）
    category: finance
    enabled: true
    never_archive: true
    source: .jarvis_state/card_annual_fee.json
    cursor_prompt: |
      カード年会費の状況を確認して。state: .jarvis_state/card_annual_fee.json
      ルール: jarvis-card-fee-guard.mdc（有効期限退会≠完了、二重会員は両方に年会費）。
      Olive Infinite（99,000）と単体PP（退会済みなら追加なし）を分けて報告。
      次回引落日・解約期限・退会モード・資産運用特典を整理。期限が近いなら先に警告。
      秘密は .env.jarvis_private（PP_CANCEL_* / OLIVE_INF_*_FEE_*）。値は出さない。

  - id: card_debit_watch
    title: Olive Infinite 引落（支払い準備）
    category: finance
    enabled: true
    never_archive: true
    source: .jarvis_state/card_debit_watch.json
    cursor_prompt: |
      カード月次引落（支払い）を確認して。state: .jarvis_state/card_debit_watch.json
      Olive Infinite が本線。気づきはダッシュボード、処置は KURASHIFT /money-ops。
      コマンド: scripts/jarvis_card_debit_watch.py
      金額未確定なら Vpass で確定し --set olive_infinite --amount N --due YYYY-MM-DD
      年会費ウォッチ（card_annual_fee）と混ぜない。

  - id: airwallet_banks
    title: エアウォレット対応銀行
    category: finance
    enabled: true
    never_archive: true
    source: .jarvis_state/airwallet_banks_weekly.json
    cursor_prompt: |
      エアウォレット対応銀行の週次結果を確認して。
      state: .jarvis_state/airwallet_banks_weekly.json
      設定: config/kurashift_airwallet_banks.yaml
      コマンド: scripts/jarvis_airwallet_banks_weekly.py
      家計で使う銀行が新たに対応したら AW 紐づけを案内（≤10万は AW 優先）。
      ルール: jarvis-airwallet-prefer.mdc

  - id: mobile_plan
    title: 携帯プラン乗り換え（Y!mobile/UQ）
    category: finance
    enabled: true
    never_archive: true
    source: .jarvis_state/mobile_plan.json
    cursor_prompt: |
      携帯プラン乗り換えの状況を確認して。半年サイクル（現契約 Y!mobile → 次回 2026-12-05 UQ mobile）。
      正本: config/mobile_plan_watch.yaml
      state: .jarvis_state/mobile_plan.json
      コマンド: scripts/jarvis_mobile_plan_check.py --mark-checked
      反映: scripts/jarvis_dashboard_push.py --watch-only
      Zaim 月額超過・未消し込みオプション・PayPay CB・乗り換え残日数を見て報告。
      特記: 円香の携帯は UQ からのレンタル。移行時に返却＋新スマホ購入が必要。
      認証（値はチャットに出さない）:
        cd ~/git-repos && set -a && source .env.jarvis_private && set +a
        変数: YMOBILE_L1〜L4_PHONE / PASSWORD、DMM_LOGIN_EMAIL / DMM_PASSWORD、UQ_LOGIN_*
      手続き時: my Y!mobile（https://my.ymobile.jp/）をブラウザで開き、回線ごとに確認しながら進める。
      対外的な確定操作（解約・申込・MNP）の前は必ずユーザー確認。

  - id: line_export
    title: LINE公式エクスポート経過
    category: line
    enabled: true
    source: .jarvis_state/line_export_reminder.json
    cursor_prompt: |
      LINE公式エクスポートの経過日数を確認して。促しレベルが ask/suggest のルートがあれば報告して。
      コマンド: scripts/jarvis_line_export_check.py
      ルール: jarvis-line-export-reminder.mdc

  - id: westudy_weekly
    title: WeStudy週次CI
    category: ops
    enabled: true
    source: .jarvis_state/westudy_weekly_watch.json
    cursor_prompt: |
      WeStudy週次 GitHub Actions の結果を確認して。失敗ならログ要約と再実行案を。
      コマンド: scripts/jarvis_westudy_weekly_check.py
      ルール: jarvis-westudy-weekly-watch.mdc

  - id: vercel_deploy
    title: Vercelデプロイ
    category: ops
    enabled: true
    source: gha:ops_fail_watch
    cursor_prompt: |
      Vercel Production/Development のデプロイ失敗を確認して直して。
      jarvis-dashboard と project-ge の双方。npm run build で再現し、修正後 push。
      直したら: python scripts/jarvis_ops_fail_watch.py --push --note '直した内容'
      （失敗ピンは消えて「Jarvisが直したよ」に切り替わる。アーカイブしない）
      ルール: jarvis-ops-fail-watch.mdc

  - id: gha_workflow_fail
    title: GitHub Actions失敗
    category: ops
    enabled: true
    source: gha:ops_fail_watch
    cursor_prompt: |
      失敗した GitHub Actions を直して。ログ要約→修正→再実行。
      直したら: python scripts/jarvis_ops_fail_watch.py --push --note '直した内容'
      （失敗ピンは消えて「Jarvisが直したよ」に切り替わる。アーカイブしない）
      ルール: jarvis-ops-fail-watch.mdc

  - id: ops_fix_notice
    title: Jarvisが直したよ
    category: ops
    enabled: true
    source: gha:ops_fail_watch
    cursor_prompt: |
      ホーム／状況ウォッチの「Jarvisが直したよ」を確認。
      「確認しました」で消してよい（アーカイブに溜めない・都度確認）。

  - id: glucon_report_due
    title: グルコン報告（活動・成果）
    category: kamiooya
    enabled: true
    source: .jarvis_state/glucon_report.json
    cursor_prompt: |
      グルコン提出期限を確認して。開催日−10日が期限。前回期限〜今回期限の Journal から
      活動報告・成果報告をまとめる。Dashboard /glucon。
      コマンド: scripts/jarvis_glucon_report_check.py --mark-checked
      Journal sync: scripts/jarvis_glucon_journal_sync.py
      投稿: scripts/jarvis_westudy_forum_post_worker.py --dry-run のあと --i-confirm-post

  - id: openchat_threads
    title: 815スレッド健全性（常時監視）
    category: line
    enabled: true
    source: line_unofficial_poc/.line_auth/.chrline_open_chat_watch_status.json
    cursor_prompt: |
      815オープンチャットの常時監視・スレッド健全性・メイン鮮度を確認して。
      status JSON・watch.err.log・今日の【スレッド】・直近【メイン】追記を見て報告して。
      全ルートでメインが止まっているときはパートナー確認／朝 --with-line／QR。
      ルール: jarvis-openchat-thread-health.mdc / ダッシュボード /openchat

  - id: square_probe
    title: Square API復活監視
    category: line
    enabled: true
    source: .jarvis_state/square_probe.json
    cursor_prompt: |
      Square API プローブの状態を確認して。structural_limit や最終OK日を見て、
      必要なら scripts/jarvis_square_probe_check.py --probe --allow-qr-login を案内して。

  - id: chrline_version
    title: CHRLINE版
    category: ops
    enabled: true
    source: .jarvis_state/chrline_version.json
    cursor_prompt: |
      CHRLINE-Patch の版を確認して。update_available なら更新手順を案内して。
      コマンド: scripts/jarvis_chrline_version_check.py

  - id: car_loan
    title: マイカーローン進捗
    category: finance
    enabled: true
    source: .jarvis_state/car_loan.json
    cursor_prompt: |
      マイカーローン（MINI）の進捗を car_loan.json から確認して。
      funding_setup や期限・未完了があれば次の一手を提案して。

  - id: sbi_vpoint_up
    title: SBI Vポイントアップ設定
    category: finance
    enabled: true
    source: .jarvis_state/sbi_vpoint_up_checklist.json
    cursor_prompt: |
      SBI Vポイントアップのチェックリストを確認して。
      confirm / id_dominant / 1pct など要フォロー項目があれば整理して。
      コマンド: scripts/jarvis_sbi_vpoint_up_setup.py --status

  - id: night_triage
    title: 夜間トリアージ
    category: ops
    enabled: true
    source: .jarvis_state/night_triage/queue.json
    cursor_prompt: |
      夜間トリアージの queue を確認して。pending 件数・最終更新・エンジン設定を報告して。
      ダッシュボード: http://127.0.0.1:8765/
      ルール: jarvis-night-triage.mdc

  - id: zaim_quality
    title: Zaim Watch
    category: finance
    enabled: true
    never_archive: true
    source: .jarvis_state/zaim_quality_watch.json
    cursor_prompt: |
      Zaim Watch（財務）を確認して。ダッシュボード /zaim が本線。
      日常買い物の二重取込と「集計に含める／含めない」の食い違い、銀行・カード連携の鮮度、
      自動で直した履歴（changelog）を見て。行ごとの確認OKは不要。「確認した」まで残る。
      「おかしい」は学習ミスのフラグ（直し先は Zaim 本体）。
      ホーム「Jarvisが直したよ（財務）」は確認するまで残る。確認後に消え、新規の直しだけ再表示。
      state: .jarvis_state/zaim_quality_watch.json / zaim_bank_sync.json / zaim_watch_changelog.json
      検知: scripts/jarvis_zaim_quality_check.py / jarvis_zaim_bank_sync_check.py
      週次ランナー: scripts/jarvis_zaim_watch_runner.py
      （学習 → 集計自動適用 → 高確信度費目自動適用 → snapshot → 確認）
      学習: scripts/jarvis_zaim_learn.py / .jarvis_state/zaim_learn_rules.json
      銀行更新: Zaim Web 口座一覧。Suica 画像認証は手動。OTP は .env.jarvis_private（値は出さない）
      ETC 同額は対象外。

  # 2026-08 一時 Pro Plus → 9月前に Pro へ戻す（意図しない継続課金防止）
  - id: cursor_pro_plus_downgrade
    title: Cursor Pro Plus → Pro に戻す（様子見）
    category: ops
    enabled: true
    never_archive: true
    source: "方針 2026-08-28 / cursor.com/dashboard/billing / grok-bot/plans"
    cursor_prompt: |
      Cursor は Pro へ Schedule Downgrade（今日実行可。次回更新日まで Pro+ 継続→その更新から Pro $20）。
      困ったら Adjust plan で Pro+ 再上げ（即時・日割り返金／クレジット別取引）。年額 Pro+ は Notion 年額 9/28 の後。
      枠の正: Spending タブ。Other Models $20 が先に尽きやすい。Cursor Models（Composer/Grok）は別枠。
      Grok Bot: Pro でも利用可（週次枠は Pro+ より小。公式 2026-08-26）。Bot ルーティンで週次枠不足なら Pro+。
      SuperGrok 連携は Pro+ より高いので採用しない。
      ダッシュボード課金: /billing（Cursor 行）。

  - id: cursor_usage_watch
    title: Cursor 枠（Other / Cursor Models）
    category: ops
    enabled: true
    never_archive: true
    source: .jarvis_state/cursor_usage_watch.json
    cursor_prompt: |
      Cursor の枠使い切りを確認して。state: .jarvis_state/cursor_usage_watch.json
      Spending 画面を目視し、scripts/jarvis_cursor_usage_watch.py --set で％を更新 → --push。
      Other ≥70% は Composer/Cursor Grok へ寄せ、≥90% や残日少＋半分超えは Pro+ 再上げを検討。
      Grok Bot 週次枠不足（ルーティン停止・plan 画面で枯渇）も Pro+ 検討。SuperGrok 連携は Pro+ より高いので採用しない。
      ダッシュボード: /billing の「Cursor 枠」カード。

  - id: jarvis_private_backup
    title: Jarvis Private バックアップ（.env.age）
    category: ops
    enabled: true
    never_archive: true
    source: .jarvis_state/jarvis_private_backup.json
    cursor_prompt: |
      .env.jarvis_private の age 暗号化バックアップ。週次 launchd（日曜 08:30）。
      手動: scripts/jarvis_private_backup.py --backup / --status / --restore
      復号鍵は EasyPass2（自動連携なし）。平文・秘密鍵は iCloud/Drive/Git に置かない。
      8日超で warn、14日超で attention。平常時は ok でダッシュボード参照のみ。
      手順: docs/運用コマンド一覧.md「Jarvis Private バックアップ」

  - id: grok_bridge_inbox
    title: 部長ボックス（Grok → Jarvis）
    category: ops
    enabled: true
    never_archive: true
    source: .jarvis_state/grok_bridge_inbox.json
    cursor_prompt: |
      部長ボックス（admin Drive【with Grok bot】/10_inbox_from_grok）の未処理を確認して。
      state: .jarvis_state/grok_bridge_inbox.json
      ポーリング: scripts/jarvis_bucho_inbox_poll.py [--push]
      処理後: --archive FILE.md または --mark-seen FILE.md
      Jarvis→部長は scripts/jarvis_bucho_outbox_write.py（20_outbox_to_grok）。
      設定: config/kurashift_grok_bridge_folders.yaml

  - id: hawk_weekly_summary
    title: ホーク週次サマリー（weekly_summary）
    category: ops
    enabled: true
    never_archive: true
    source: .jarvis_state/hawk_weekly_summary.json
    cursor_prompt: |
      ホーク参謀室の週次統括サマリー（action: weekly_summary）を確認。
      state: .jarvis_state/hawk_weekly_summary.json
      取込: jarvis_bucho_inbox_poll.py（朝バンドルに含む）
      処理後: --mark-seen または --archive で inbox から退避
      設計: docs/Grok_参謀室_週次統括_設計_20260830.md

  - id: kanji_ops
    title: 飲み会幹事（レポート・次回）
    category: kamiooya
    enabled: true
    never_archive: true
    source: .jarvis_state/kanji_ops.json
    cursor_prompt: |
      飲み会幹事の状況を確認して。state: .jarvis_state/kanji_ops.json
      正本: 01_運営サポート/飲み会幹事/00_幹事標準マニュアル.md と 01_振り返り比較ログ.md
      ダッシュボード: /kanji
      ルール: jarvis-kamiooya-kanji.mdc
      レポート期限・次回イベント立ち上げが近ければ先に警告。
      Drive OAuth は estate。フォーム送信前は確認必須。
