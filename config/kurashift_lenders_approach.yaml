matsuno_area_strategy:
  primary:
  - aichi
  - gifu
  primary_label: 本命（愛知・岐阜）
  pipeline:
  - sendai
  - gunma
  pipeline_label: 今後視野（仙台・群馬。ゆかり物件があれば買い進め）
  rule: 本命レーンと今後視野レーンを銀行メモ上で混合しない。各銀行の region_tags／notes 先頭に【対象エリア】を書く。
matsuno_debt_strategy:
  why: 残債が自行のみか他行含むかは買い進め順序に直結する
  rule: notes に【残債】を明記。scope=other_banks_included / repay_ratio_all / own_unclear / unknown
  key_contrast:
  - 'オリックス: 他行含む残債合計を年収倍率枠から控除（収入倍率型）'
  - '静岡: 収入倍率上限は弱いが、他行含む既往負債をBS・収支で見る＋地銀協団信枠3億は他行地銀と共有'
  - 'auじぶん: 住宅含む全返済の返済比率（残債残高倍率より返済額）'
  - 'スルガ: 個人・法人問わず借入総額 vs 年収目安（会員例30倍）'
