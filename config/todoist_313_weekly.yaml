# 313 週の整理（scripts/jarvis_todoist_313_weekly.py）の基準。松野さん了承 2026-11-24（Orca 項目50）
# 変えたら 313 の CLAUDE.md 改善ログに1行。読めない・形が違う時はスクリプトが止まる（基準なしでは動かない）

version: 1

# A「済みました」— 根拠がはっきりした件だけ 313 が先に閉じる
done:
  # 強い根拠として数える種類（これ以外は B に回して本人に選んでもらう）
  #   pr_merged     … 説明・コメントに貼られた GitHub PR がすべてマージ済み
  #   issue_closed  … 貼られた GitHub Issue がすべて「完了」で閉じている
  #   task_done     … 貼られた別の Todoist タスクがすべて完了（元タスク・関連タスクを貼るだけの件が多いので既定は弱い根拠）
  strong_kinds: [pr_merged, issue_closed]
  # 根拠（マージ等）の後に「済み」報告以外のコメントがあれば A にしない（その後の状態が書かれているため）
  no_comment_after: true
  # 根拠（マージ・完了）がタスクを作った日より後であること（前からある PR を背景として貼っただけの件を除く）
  require_after_added: true
  # 題・説明・最後のコメントにこれがあると A にしない（後追いの確認・お金・対外は本人へ）→ B で「済み？」と聞く
  hold_words: [【松野さん】, 確認, 待ち, マージ後, 反映後, 設定, 本番, 様子, 見守, 検証, 追従, 定着, 効果, 次回, 翌週, フォロー, 振込, 支払, 送金, 入金, 解約, 退会, 契約, 対外, 送信, 要ボス, 要判断]
  # このラベルが付いていたら A にしない
  hold_labels: []
  # エージェントの「済み」コメント（弱い根拠 → B で「済み？」）
  agent_comment_re: '^【(Miss Lemon|Jarvis|FRIDAY|318|313|ホーク)】'
  agent_done_re: '(完了しました|済みました|対応済み|やり切り|マージ済み|反映済み)'
  # 1回で閉じる上限（超えた分は次の週に回す）
  max_close: 15
  # 閉じた件を戻せる日数
  undo_days: 7

# B「やめてもいいのでは」— 長く動きがない件を本人に 済み／やめる／残す で選んでもらう
stale:
  # 題・説明・コメントの最後の動きからの日数
  idle_days: 21
  # 期日が今日より先の件は出さない（先の予定として置いてある）
  skip_future_due: true
  # 「残す」を選んだ件は、この日数は出さない
  keep_days: 28
  # 1回に出す上限
  max_cards: 20

# 今週の9件（weekly_pick の確定）を何日前まで読むか
weekly_pick_lookback_days: 14
# 318 の /313/bulk 待ちが古いとみなす日数（これより古ければ 318 は止まっている扱い）
queue_318_stale_days: 3
