# KURASHIFT Theme / LifePlan playbook
# 人間＋アプリ＋Mac worker の正本。秘密は書かない。

app:
  name: KURASHIFT
  subtitle: 暮らしを整え、資産を動かす
  code_path: apps/trade-desk
  port: 3003

numbers:
  canonical_path: >-
    /Users/matsunomasaharu2/Library/Mobile Documents/com~apple~Numbers/Documents/Life Plan/260621_松野家FinancePlan.numbers
  archive_dir: >-
    /Users/matsunomasaharu2/Library/Mobile Documents/com~apple~Numbers/Documents/Life Plan
  # 実績: 年次確定後は据え置きで継ぎ足し。計画: 翌年以降を毎年見直し。
  # 時点版は kurashift_lifeplan_versions（scripts/jarvis_kurashift_history_ingest.py）
  sheets:
    cashflow: キャッシュフロー
    cashflow_tables:
      events: 表3.ライフイベント
      income: 表4.生活収入
      expense: 表5.生活支出
      eval: 表8.収支評価
    # アプリ: /lifeplan = 生涯CF（閲覧）、/lifeplan/analyze = 分析、/lifeplan/budget = 予算編成
    single_income: シングルインカム年収手取
    table1: 表1.月別予算設定
    table2: 表2.収入まとめ
    roi: ROI・リバランスまとめ

lifeplan_routine:
  cadence: 1_to_3_per_year
  home_focus: false  # トップは Theme／資産ステータス。LPはレーン＋お知らせ
  triggers:
    - id: annual_after_december
      when: january_february
      notice: 年間実績確定 → 当年以降の LP／予算更新
      mode: annual
    - id: real_estate_purchase
      when: on_purchase
      mode: re_purchase
      entry: /lifeplan?mode=re_purchase
    - id: other
      when: ad_hoc
      entry: local_jarvis_consultation
  steps:
    - id: ingest_actuals
      label: 年度実績を取り込む
      job: lifeplan_ingest_actuals
    - id: revise_budget
      label: 実績を見て予算を補正する
      job: lifeplan_revise_budget
    - id: update_century_plan
      label: 100年ライフプランを更新・チューニングする
      job: lifeplan_update_century
    - id: push_finance
      label: 固めた予算を財務へ反映する
      job: lifeplan_push_zaim
  abg_targets:
    alpha_save_pct: 20
    beta_living_pct: 60
    gamma_self_pct: 20
  delta_real_estate_in_growth_eval: false

home:
  primary:
    - theme_proposals
    - theme_execution
    - portfolio_status
    - status_based_suggestions
  secondary_notices:
    - annual_lifeplan_window


execution_boundary:
  routine_entry: app_button
  consultation_entry: local_jarvis
  app_shows: [job_status, logs, artifacts, consultations, proposals, tax_cases]
  never_without_approval: [live_trade, fund_transfer, yayoi_register]

approval_then_run:
  preview_required: true
  otp:
    sms: messages_db
    email: gmail_api
  stop_only_for: [biometrics, app_only_wall, otp_unreachable]

bloomo:
  primary: web
  fixed_sleeve_pct_range: [70, 80]
  dynamic_sleeve_pct_range: [20, 30]
  public_api: false

index_rebalance:
  frequency: annual
  keep_jgb_ratio: false

# あかつき外国債券（2026-08-13 本人確定）
akatsuki_bond:
  name: GS劣後債 5.15 USD 20450522
  coupon_pct: 5.15
  pay_dates: ["05-22", "11-22"]
  maturity: "2045-05-22"
  isin: US38148LAF31
  policy: hold_do_not_add
  # 売らない。これ以上増やさない。余剰現金は surplus_cash 順（SBI 上乗せではない）。
  rationale: 米高金利局面で意図して厚くした。値動きは株式より穏やか。利金を引き出して使った実績あり。成長エンジンは株式のまま。

# SBI NISA クレカ積立（2026-08-13 本人確定）
sbi_nisa_credit:
  monthly_jpy: 90000
  mix: { developed: 70000, emerging: 10000, japan: 10000 }
  channel: nisa_credit_card_vpoint
  policy: fixed_do_not_increase
  # 回し続けるが上乗せしない。金額・内訳は Jarvis が勝手に変えない。

# 余った現金の優先（2026-08-13）
surplus_cash:
  - living_and_property_buffer
  - keep_next_property_down_payment
  - theme_yield_bloomo_dynamic  # 承認前提。コア置き換え禁止

# 助言の理念（詳細は .cursor/rules/jarvis-finance-philosophy.mdc）
finance_philosophy:
  paper: お金は寝かせて増やしなさい
  cashflow: 金持ち父さん貧乏父さん
  paper_core: worldwide_or_developed_index
  real_estate: cashflow_asset
  do_not:
    - sell_index_for_themes
    - sell_akatsuki_bond
    - dismiss_rental_cf
    - increase_sbi_nisa_above_90k
    - spot_add_to_nisa_instead_of_theme


insurance_core:
  - sony_life
  - sony_life_chikage
  - prudential_life
  - prudential_life_chikage

tax:
  personal_only: false
  corporate: knees_bee_gmail_pdf
  yayoi_csv: true
  evidence_reexport: true
  gmail_ingest: true

allowed_jobs:
  - lifeplan_ingest_actuals
  - lifeplan_revise_budget
  - lifeplan_update_century
  - lifeplan_push_zaim
  - lifeplan_snapshot
  - tax_build_yayoi_csv
  - tax_ingest_accountant_mail
  - tax_ingest_manual_dir
  - tax_export_evidence
  - portfolio_weekly
  - theme_preview  # 提案のみ。実弾は別承認ジョブ
  - theme_propose_from_status
  - theme_ensure_index_rb
  - theme_execute_assist  # 手順メモのみ。live 発注はしない
  - secrets_upsert
  - secrets_status
  - buy_plan_ingest
  - buy_plan_export
  - re_mail_match
  - re_deal_advice
  - re_deal_mark_gmail_read  # 千三つ「確認した／対象外」→ Gmail UNREAD 除去
  - re_deal_inquiry_send  # 不動産会社へ第一問い合わせ（From=estate・UI確認必須）
  - re_deal_inquiry_poll  # 第一問い合わせスレッドの返信取込
  - re_deal_ops_pack  # 運営相談パック（consultations）
  - ops_consult_ingest
  - re_sync_loan_tracker  # Discover未完了時は明示エラーで止まる
  - re_revise_plan  # dry-run既定。apply は UI confirm 必須

secrets:
  store: .env.jarvis_private
  via: app_/settings → kurashift_jobs → Mac worker
  scrub_payload_after_success: true

insurance_policy_loan:
  purpose: 不動産購入時の頭金枠（保険投資額の範囲内で借入可能）
  primary: sony_life_surrender_page  # 契約者貸付元利金(4)／自動振替(3)
  accounts:
    - sony_life_policy_loan
    - sony_life_chikage_policy_loan
    - prudential_life_policy_loan
    - prudential_life_chikage_policy_loan

# ③ 不動産賃貸経営（Phase 0＝設計のみ。実装は docs/KURASHIFT_不動産賃貸経営.md）
real_estate_operations:
  entry: /realestate
  design_doc: docs/KURASHIFT_不動産賃貸経営.md
  # ③ 内は2レーンに分離（2026-08-12 ユーザー方針）
  sub_lanes:
    operations:
      id: re_operations
      label: 運用・計画進捗
      purpose: 今持っている資産が計画に対して現在どうか（YTD・差分・補正）
      entry: /realestate
      status: in_progress  # Sprint2: CF KPI・Bridge・メール候補・助言まで。YTD合算は未
    acquisition:
      id: re_acquisition
      label: 新規購入検討
      purpose: これから買う物件の検討を案件としてまとめる
      entry: /realestate/deals
      status: in_progress  # 千三つUI・mail match・advice 実装済。健美家/楽待は未
    property_master:
      id: re_property_master
      label: 保有物件マスタ
      purpose: 所有物件の基本情報。ローンは借入残高トラッカー連携（正本）
      entry: /realestate/properties
      status: planned
      external:
        loan_tracker:
          role: loan_data_source
          url: https://loan-tracker-plum.vercel.app/
          google_account: estate
          sync: re_sync_loan_tracker  # Drive形式調査後
          legacy_name: 本田さんアプリ
    finance_pack:
      id: re_finance_pack
      label: 融資提出パック
      purpose: 融資時書類一覧・必要事項入力・銀行向け出力
      entry: /realestate/finance-pack
      status: planned
      templates: config/kurashift_re_finance_doc_templates.yaml
  entities: [personal, corporate, combined]
  default_view: combined
  theme_lane: realestate
  theme_sub_tags: [operations, acquisition]
  data_sources:
    personal_actuals: zaim_19
    corporate_actuals: tbd  # MyKomon / 税理士 CSV / 手入力 — Phase 2 で確定
    occupancy: property_units
    plan_canonical: numbers_19_sheet
  jobs_planned:
    - re_ingest_actuals
    - re_build_plan_from_actuals
    - re_compare_plan_actual
    - re_revise_plan

theme:
  start_simple: true
  iterate_via_consultation: true
  card_states: [draft, consulting, approved, executing, closed, reviewed]
