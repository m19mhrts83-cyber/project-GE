# KURASHIFT 株式ウォッチ（Theme 衛星スリーブ）
# 日次: GHA kurashift-stock-watch-daily.yml
# 判断ログの正本: Todoist「Theme株式」（lane theme_stock）
# 自動発注はしない（立花 API は apps 未着手棚）

enabled: true

notify:
  todoist_lane: theme_stock
  on_propose: true
  on_threshold: true
  dedupe_hours: 48
  owner_confirm_kinds:
    - near_bottom
    - upside_ready
    - sell_signal

thresholds:
  lookback_days: 60
  bottom_buffer_pct: 2.0
  near_bottom_pct: 1.5
  upside_ready_pct: 5.0
  sell_drawdown_pct: 8.0
  upside_target_pct: 12.0

# ポジション連動（売りサイン精密化）
# 保有数量・取得単価は trade_positions（live 優先 → paper）を参照。
# 立花APIの自動残高取得は未配線。手動約定後は --record-fill で live に記録。
position:
  require_for_sell: true          # 保有0なら sell_signal を出さない（ノイズ防止）
  prefer_modes:                   # 同一銘柄は先頭モードを優先
    - live
    - paper
  take_profit_from_cost_pct: null # null = thresholds.upside_target_pct
  stop_from_cost_pct: null        # null = thresholds.sell_drawdown_pct

propose:
  max_themes: 3
  min_score: 0.55
  exclude_themes:
    - index
  exclude_asset_classes:
    - inverse_etf

# 発注前プレビュー＋対外確認ゲート（Phase2 入口）
# 実発注はしない。プレビューを作り、オーナー確認（Todoist Theme株式）を経て
# 手動発注アシスト手順を出すだけ。立花API自動発注は live_api=false の間は不可。
order:
  enabled: true            # プレビュー機能のマスター（false で全停止）
  live_api: false          # 立花API自動発注。将来タスク。ここでは必ず false
  broker: tachibana
  per_name_max_jpy: 20000  # 1銘柄あたり上限（Tranche1 想定）
  total_capital_jpy: 100000
  min_unit: 100            # 日本株・ETFの売買単位
  allow_odd_lots: true     # 1単元が枠を超える場合は単元未満（かぶミニ等）にフォールバック
  limit_buffer_pct: 0.5    # 指値は前日終値±この％
  stale_price_pct: 3.0     # 確認時に終値が乖離していたら再プレビュー
  core_symbols:            # NISAコア相当。提案・発注の対象外
    - "1306.T"
    - "1321.T"
    - "1545.T"
    - "1546.T"
  buy_signal_kinds:
    - near_bottom
    - upside_ready
  sell_signal_kinds:
    - sell_signal
  money_path: "立花証券e支店（特定口座・源泉徴収あり）"
  otp_note: "取引パスワード／都度確認は本人。Jarvis は OTP・最終送信を代行しない"
  # 立花e支店は海外株式（米国株含む）非対応（2026-09-25 確認・恒久）。
  # symbol が .T 以外（米株等）は発注プレビュー対象外。GAFAM等は監視のみで watchlist enabled=false のまま。

kurashift:
  base_url: https://jarvis-trade-desk.vercel.app
  stock_watch_path: /stock-watch

# 監視中は state の watches が正。seed は初回マージ用
seed_watches: []
