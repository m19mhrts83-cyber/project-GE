# Zaim 品質ウォッチ（二重取込・集計設定）
# 検知: scripts/jarvis_zaim_quality_check.py → .jarvis_state/zaim_quality_watch.json
# 直し: scripts/jarvis_zaim_money_apply.py（集計は Watch runner が安全分を自動。費目は学習 high を自動）

version: 1

csv_base_dir: "~/Library/CloudStorage/OneDrive-個人用/215_神・大家さん倶楽部/50_税金,確定申告"

include_label: "常に集計に含める"
exclude_label: "集計に含めない"

# 日常買い物（スマートレシート×クレカ突合の店）
daily_shop_keywords:
  - アオキ
  - ミニストップ
  - ファミリーマート
  - ファミマ
  - セブン
  - ローソン
  - ハロー
  - hallo
  - オークワ
  - イオン
  - ダイソー
  - 無印
  - マツモトキヨシ
  - スギ薬局
  - ウエルシア

exclude_shop_keywords:
  - ETC
  - 高速

card_pay_keywords:
  - アメリカン・エキスプレス
  - 三井住友
  - PayPayカード
  - 楽天カード
  - Olive

attention_dup_yen: 50000

dual_source_rules:
  - id: smart_vs_card_daily
    description: "日常店はスマートレシートを含め、同額クレカは含めない"
    include_side: smart
    exclude_side: card
  - id: amazon_site_vs_card
    description: "Amazon はサイト連携（支払元 Amazon.co.jp）を含め、店が Amazon のクレカは含めない"
    include_side: amazon_site
    exclude_side: amazon_card

must_include:
  - id: orico_solar
    description: "オリコ（太陽光ローン）は実績に含める"
    shop_keywords:
      - オリコ
      - ORICO
    pay_keywords: []

must_exclude:
  - id: foreign_bond_stock_valuation
    description: "あかつき・Bloomoの外国債/株の週次評価は集計に含めない"
    account_keywords:
      - あかつき
      - bloomo
      - ブルーモ
    comment_keywords:
      - 週次評価
    category_keywords:
      - 外国債
      - 株増収
      - 外国株

# 費目見直し（二段キー）
# - その他／使途不明／未分類 → 店名キー（「この店ならこれ」8〜9割）。count>=2 で自動
# - 食費など自信あり誤分類 → 店+金額キー（Amazon 等の店単独誤爆を避ける）
# - shop_only_exclude: 物によって費目が違う店は店名キー学習しない
# - Slack #report: 直し／学習が1件以上のときだけ（JARVIS_ZAIM_CATEGORY_SLACK_REPORT_DISABLE=1 でオフ）
category_review:
  lookback_days: 14
  max_items: 25
  auto_min_count: 2
  suspicious_substrings:
    - その他
    - 使途不明
    - 未分類
  shop_only_exclude_keywords:
    - Amazon
    - amazon
    - アオキ
    - イオン
    - オークワ
    - ハロー
    - hallo
  # 品目・店名からの提案（Zaim のカテゴリ名そのまま）。学習ルールが無いときの low のみ
  suggest_rules:
    - suggest: "β.2C.食費"
      keywords: [野菜, トマト, パン, ヨーグルト, 牛乳, 卵, 肉, 魚, 米, 弁当, アオキ, イオン, オークワ]
    - suggest: "β.5C.日用雑貨"
      keywords: [ダイソー, 無印, 洗剤, ティッシュ, 日用]
    - suggest: "β.8C.交通"
      keywords: [Suica, 交通, バス, 電車, タクシー]
    - suggest: "β.7C.医療費"
      keywords: [薬局, 病院, クリニック, マツモトキヨシ, スギ薬局, ウエルシア]
