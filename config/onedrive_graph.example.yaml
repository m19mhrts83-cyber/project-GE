# OneDrive / Microsoft Graph（jarvis_onedrive_graph.py）
# 秘密は .env.jarvis_private のみ。この YAML はパス・メモ用。

provider: onedrive
# 読取のルート相当（個人用 OneDrive）
# Azure Portal 手順（要約）:
# 1. Azure Active Directory → アプリの登録 → 新規
# 2. 証明書とシークレット → 新しいクライアント シークレット
# 3. API のアクセス許可 → Microsoft Graph → アプリケーションの許可 → Files.Read.All
# 4. 「管理者の同意を与えます」
# 5. ディレクトリ(テナント)ID・アプリケーション(クライアント)ID・シークレット値を
#    .env.jarvis_private の MS_GRAPH_* へ（チャットに貼らない）
# 6. 読取対象ユーザーの UPN（例: xxx@outlook.jp）を MS_GRAPH_USER_UPN に
# 確認: python scripts/jarvis_onedrive_graph.py --dry-run

sample_paths:
  - "215_神・大家さん倶楽部/C2_ルーティン作業/26_パートナー社への相談/000_共通/連絡先一覧.yaml"
