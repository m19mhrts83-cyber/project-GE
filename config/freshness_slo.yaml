# 315 鮮度監視（デッドマンスイッチ）— 「成功が○時間届いていない」を拾う
#
# エラー検知だけでは「止まって何も出ない」静かな失敗を見落とす
# （例: オプチャのスレッドが 2026-09-30〜10-24 の 3 週間 0 件。健全性は毎日 attention を出していたが常時点灯で埋もれた）。
# ここに載せた成果物が max_age_h を超えて古くなったら #ops に 1 回だけ出す（回復したら 1 回だけ回復報告）。
#
# kind:
#   gha        … workflow の最後の success からの経過
#   file_mtime … glob に一致する最新ファイルの更新時刻（~ 可）
#   json_time  … JSON の時刻フィールド（path の * は配列／dict の全要素。最大値を採用）
# owner: 担当社員（番号＋役割）／action: 古くなったとき最初にやること（1 行）
products:
  # 接続記録はブラウザ／MCP／Driveを混同しない。初期は表示・記録のみで自動投稿しない。
  # 実確認時に .jarvis_state/integration_connections.json の checked_at/status/account を更新する。
  - id: drive_connector_admin
    label: Google Driveコネクタ（admin）
    kind: connection_state
    file: .jarvis_state/integration_connections.json
    path: google_drive_connector
    expected_account: admin@livingsupport-matsu.co.jp
    max_age_h: 168
    notify: false
    owner: 315 連携健全性点検
    action: "コネクタのプロフィールと対象Driveの読取を再確認"
  - id: notebooklm_browser_admin
    label: NotebookLMブラウザ（admin）
    kind: connection_state
    file: .jarvis_state/integration_connections.json
    path: notebooklm_browser
    expected_account: admin@livingsupport-matsu.co.jp
    max_age_h: 168
    notify: false
    owner: 315 連携健全性点検
    action: "内蔵ブラウザでプロフィールとノート一覧を再確認"
  - id: notebooklm_mcp
    label: NotebookLM MCP（ブラウザとは別）
    kind: connection_state
    file: .jarvis_state/integration_connections.json
    path: notebooklm_mcp
    expected_account: admin@livingsupport-matsu.co.jp
    max_age_h: 168
    notify: false
    owner: 315 連携健全性点検
    action: "MCPのauthenticatedを確認。必要時のみログインを実施"
  - id: drive_team_rules
    label: AIチーム正本のDrive写し
    kind: mirror_content
    source: docs/AIエージェントチーム/CLAUDE.md
    mirror: ~/Library/CloudStorage/GoogleDrive-admin@livingsupport-matsu.co.jp/マイドライブ/★AIエージェントチーム/CLAUDE.md
    owner: 315 連携健全性点検
    action: "Git正本を確認し jarvis_agent_team_status_sync.py で同期。読取不能ならDrive同期状態を確認"
  - id: openchat_threads
    label: オプチャ【スレッド】取得
    kind: json_time
    file: .jarvis_state/openchat_thread_health.json
    path: latest.routes.*.last_ok_at
    max_age_h: 36
    owner: 815 KURASHIFT更新
    action: "zsh launchd/openchat_thread_backfill.sh（新スレッドの追い上げ）→ ログの thread sync 行を確認"
  - id: openchat_main
    label: オプチャ【メイン】受信
    kind: json_time
    file: line_unofficial_poc/.line_auth/.chrline_open_chat_watch_status.json
    path: last_append_at
    max_age_h: 24
    owner: 815 KURASHIFT更新
    action: "launchctl kickstart -k gui/$(id -u)/com.matsunoma.line.openchat.watch／QR 要なら Mac で再ログイン"
  - id: openchat_batch
    label: オプチャ朝夕バッチ
    kind: file_mtime
    glob: ~/Library/Logs/jarvis_openchat_sync/sync_*.log
    max_age_h: 14
    owner: 815 KURASHIFT更新
    action: "launchctl list | grep openchat-md-db-sync で登録確認 → 最新 sync_*.log の末尾を見る"
  # ループウェア（判断ログ→週次分析→ルール反映）。見張りは .jarvis_state/loopware/status.json 1ファイル
  - id: loopware_weekly
    label: ループウェア 今週の学び（土曜の週次分析）
    kind: json_time
    file: .jarvis_state/loopware/status.json
    path: weekly.published_at
    max_age_h: 174
    owner: 314 業務品質監査
    action: "zsh launchd/weekly_review_314_runner.sh の loopware 部分 → .jarvis_state/loopware/weekly.err を見る"
  - id: loopware_status
    label: ループウェア 見張りファイル
    kind: json_time
    file: .jarvis_state/loopware/status.json
    path: checked_at
    max_age_h: 36
    owner: 314 業務品質監査
    action: "python scripts/jarvis_loopware_status.py を手で実行（朝の Mac 更新の loopware_status 段）"
  - id: loopware_decisions
    label: ループウェア 判断ログの記録
    kind: json_time
    file: .jarvis_state/loopware/status.json
    path: last_decision_at
    max_age_h: 72
    owner: 116 メール要対応
    action: "status.json の sources で止まった入口を見る → triage トリガー（pg_trigger）と Slack ボタンを確認"
  - id: gha_gmail_triage
    label: Gmail トリアージ（朝）
    kind: gha
    workflow: jarvis-dashboard-gmail-triage.yml
    max_age_h: 30
    owner: 116 メール要対応
    action: "gh run list -w jarvis-dashboard-gmail-triage.yml で失敗ログ → Secrets 期限切れを疑う"
  - id: gha_partner_day
    label: 111 パートナー昼レポート
    kind: gha
    workflow: jarvis-partner-day-report.yml
    max_age_h: 30
    owner: 111 パートナー連絡整理
    action: "gh run list -w jarvis-partner-day-report.yml → 失敗なら --log-failed"
  - id: gha_reply_211
    label: 211 返信案内・朝便
    kind: gha
    workflow: jarvis-reply-draft-211.yml
    max_age_h: 30
    owner: 211 返信案内下書き
    action: "gh run list -w jarvis-reply-draft-211.yml → MS_GRAPH_* の期限を確認"
  - id: gha_zaim
    label: Zaim 日次同期
    kind: gha
    workflow: zaim-finance-sync.yml
    max_age_h: 30
    owner: 600 リソース・家計
    action: "失敗ログのHTTP状態を確認。402 exceed_egress_quotaならSupabase利用制限、認証失敗時のみZAIMセッションを確認"
  - id: gha_re_inquiry
    label: KURASHIFT 物件問合せ（Tier3）
    kind: gha
    workflow: kurashift-re-daily-inquiry.yml
    max_age_h: 30
    owner: 500 不動産パイプライン
    action: "gh run list -w kurashift-re-daily-inquiry.yml"
  - id: gha_westudy
    label: WeStudy 取込（毎朝コメント＋日曜全部取り直し）
    kind: gha
    workflow: westudy-raimo-weekly.yml
    max_age_h: 36
    owner: 315 連携健全性点検
    action: "08:00本番と14:00補欠の失敗ログを確認。402 exceed_egress_quotaならSupabase利用制限を解消後に再実行。ログイン停滞なら時間を置く"
  - id: weekly_review_facts
    label: 314 週次機械チェック
    kind: file_mtime
    glob: .jarvis_state/weekly_review_314/facts_*.md
    max_age_h: 200
    owner: 314 業務品質監査
    action: "launchctl kickstart gui/$(id -u)/com.matsunoma.jarvis.weekly-review-314"

# 315-B 300番台 停止・空回り監視（日次・AI なし）— scripts/jarvis_stall_watch_315b.py
# 設計の正本: FlowForge 315-B（flow_ZQIfYZY4GJF2XspXY8i0sGWD）。上の products とは別の通知状態
# （.jarvis_state/stall_watch_315b.json）で、異常の発生・回復のときだけ #ops。対象は 311・312・313・314・317 だけ。
# stop: 最終成功の取り方（kind は上と同じ＋ log_last_match。gha は任意の title_contains で実行を絞れる）。ref は上の products の設定をそのまま使う
# idle: 空回りの判定（gate_draft_repeat=311／candidate_repeat=313／skip=判定なし）
stall_watch_315b:
  targets:
    - id: "311"
      label: 311 送信前品質
      owner: 311 送信前品質係
      action: "launchctl list | grep send-gate-311 → ~/Library/Logs/jarvis_send_gate_311/poll.err.log の末尾"
      # 依頼が無い時間は停止にしない。15 分ごとの定時実行（runner の見出し行）の生存で見る
      stop:
        kind: log_last_match
        glob: ~/Library/Logs/jarvis_send_gate_311/poll.log
        pattern: '(?m)^======== (\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) ========$'
        max_age_h: 1
      # 同じ下書き（gate_*.json の draft_path）を 60 分で 4 回以上判定したら空回り。14h は監視の間隔（10h/14h）を覆う
      idle:
        kind: gate_draft_repeat
        dir: docs/AIエージェントチーム/300_品質・タスク運用管理室/311_送信前品質係/output
        threshold: 4
        window_min: 60
        lookback_h: 14
    - id: "312"
      label: 312 Todoist起票整理
      owner: 312 Todoist起票整理係
      action: "gh run list -w todoist-312-collect.yml → 失敗なら --log-failed"
      # 本線は Nody の GHA（collect 月水金＋reflect）。旧 todoist_312_digest.json は 10/21 で役目を終えたので見ない
      # collect だけを数える: 同じ workflow の reflect（30分ごと）の成功では生きていると見なさない。
      # 実行の title（workflow の run-name）に title_contains が入る成功だけを見る（任意項目。無ければ今まで通り全部）。
      # 月水金 20:30 JST の間隔は最大 72h（金→月）＋GHA の遅れの余裕で 80h
      stop:
        kind: gha
        workflow: todoist-312-collect.yml
        title_contains: "312 collect"
        max_age_h: 80
    - id: "313"
      label: 313 完了候補確認
      owner: 313 完了候補確認係
      action: "launchctl list | grep 313 → ~/Library/Logs/jarvis_todoist_313_digest/todoist_313_digest.err.log の末尾"
      # 2026-11-24〜 週1回（金曜 20:00）の「週の整理」だけ。--apply が終わった回に state の at が書かれる
      # 金曜→次の金曜 168h ＋遅れの余裕で 200h。旧 done_elsewhere.json／cleanup.json は毎晩の片付けをやめたので見ない
      stop:
        kind: json_time
        file: .jarvis_state/todoist_313_weekly.json
        path: at
        max_age_h: 200
      # 週1回なので同じ候補の繰り返しは「残す」で外れる。空回り判定はしない
      idle:
        kind: skip
        note: 週1回（金曜）の週の整理。「残す」は4週出さないので繰り返し判定なし
    - id: "314"
      label: 314 業務品質監査
      owner: 314 業務品質監査
      action: "launchctl kickstart gui/$(id -u)/com.matsunoma.jarvis.weekly-review-314"
      stop:
        ref: weekly_review_facts
    - id: "317"
      label: 317 コメント起動
      owner: 317 コメント起動係
      action: "launchctl list | grep comment-dispatch → ~/Library/Logs/jarvis_comment_dispatch/launchd.err.log の末尾"
      # 300 秒ごと。0〜6 時は止まる（最終実行は前夜）が、監視は 08:20・18:20 なので 2h で足りる
      stop:
        kind: json_time
        file: .jarvis_state/comment_dispatch.json
        path: last_run_at
        max_age_h: 2
      idle:
        kind: skip
        note: 空回り判定は後で（枠だけ）
