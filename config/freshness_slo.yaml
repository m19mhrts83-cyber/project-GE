# 315 鮮度監視（デッドマンスイッチ）— 「成功が○時間届いていない」を拾う
#
# エラー検知だけでは「止まって何も出ない」静かな失敗を見落とす
# （例: オプチャのスレッドが 2026-09-30〜10-24 の 3 週間 0 件。健全性は毎日 attention を出していたが常時点灯で埋もれた）。
# ここに載せた成果物が max_age_h を超えて古くなったら #ops に 1 回だけ出す（回復したら 1 回だけ回復報告）。
#
# kind:
#   gha        … workflow の最後の success からの経過
#   file_mtime … glob に一致する最新ファイルの更新時刻（~ 可）
#   json_time  … JSON の時刻フィールド（path の * は配列／dict の全要素。最大値を採用）
# owner: 担当社員（番号＋役割）／action: 古くなったとき最初にやること（1 行）
products:
  # 接続記録はブラウザ／MCP／Driveを混同しない。初期は表示・記録のみで自動投稿しない。
  # 実確認時に .jarvis_state/integration_connections.json の checked_at/status/account を更新する。
  - id: drive_connector_admin
    label: Google Driveコネクタ（admin）
    kind: connection_state
    file: .jarvis_state/integration_connections.json
    path: google_drive_connector
    expected_account: admin@livingsupport-matsu.co.jp
    max_age_h: 168
    notify: false
    owner: 315 連携健全性点検
    action: "コネクタのプロフィールと対象Driveの読取を再確認"
  - id: notebooklm_browser_admin
    label: NotebookLMブラウザ（admin）
    kind: connection_state
    file: .jarvis_state/integration_connections.json
    path: notebooklm_browser
    expected_account: admin@livingsupport-matsu.co.jp
    max_age_h: 168
    notify: false
    owner: 315 連携健全性点検
    action: "内蔵ブラウザでプロフィールとノート一覧を再確認"
  - id: notebooklm_mcp
    label: NotebookLM MCP（ブラウザとは別）
    kind: connection_state
    file: .jarvis_state/integration_connections.json
    path: notebooklm_mcp
    expected_account: admin@livingsupport-matsu.co.jp
    max_age_h: 168
    notify: false
    owner: 315 連携健全性点検
    action: "MCPのauthenticatedを確認。必要時のみログインを実施"
  - id: drive_team_rules
    label: AIチーム正本のDrive写し
    kind: mirror_content
    source: docs/AIエージェントチーム/CLAUDE.md
    mirror: ~/Library/CloudStorage/GoogleDrive-admin@livingsupport-matsu.co.jp/マイドライブ/★AIエージェントチーム/CLAUDE.md
    owner: 315 連携健全性点検
    action: "Git正本を確認し jarvis_agent_team_status_sync.py で同期。読取不能ならDrive同期状態を確認"
  - id: openchat_threads
    label: オプチャ【スレッド】取得
    kind: json_time
    file: .jarvis_state/openchat_thread_health.json
    path: latest.routes.*.last_ok_at
    max_age_h: 36
    owner: 815 KURASHIFT更新
    action: "zsh launchd/openchat_thread_backfill.sh（新スレッドの追い上げ）→ ログの thread sync 行を確認"
  - id: openchat_main
    label: オプチャ【メイン】受信
    kind: json_time
    file: line_unofficial_poc/.line_auth/.chrline_open_chat_watch_status.json
    path: last_append_at
    max_age_h: 24
    owner: 815 KURASHIFT更新
    action: "launchctl kickstart -k gui/$(id -u)/com.matsunoma.line.openchat.watch／QR 要なら Mac で再ログイン"
  - id: openchat_batch
    label: オプチャ朝夕バッチ
    kind: file_mtime
    glob: ~/Library/Logs/jarvis_openchat_sync/sync_*.log
    max_age_h: 14
    owner: 815 KURASHIFT更新
    action: "launchctl list | grep openchat-md-db-sync で登録確認 → 最新 sync_*.log の末尾を見る"
  - id: gha_gmail_triage
    label: Gmail トリアージ（朝）
    kind: gha
    workflow: jarvis-dashboard-gmail-triage.yml
    max_age_h: 30
    owner: 116 メール要対応
    action: "gh run list -w jarvis-dashboard-gmail-triage.yml で失敗ログ → Secrets 期限切れを疑う"
  - id: gha_partner_day
    label: 111 パートナー昼レポート
    kind: gha
    workflow: jarvis-partner-day-report.yml
    max_age_h: 30
    owner: 111 パートナー連絡整理
    action: "gh run list -w jarvis-partner-day-report.yml → 失敗なら --log-failed"
  - id: gha_reply_211
    label: 211 返信案内・朝便
    kind: gha
    workflow: jarvis-reply-draft-211.yml
    max_age_h: 30
    owner: 211 返信案内下書き
    action: "gh run list -w jarvis-reply-draft-211.yml → MS_GRAPH_* の期限を確認"
  - id: gha_zaim
    label: Zaim 日次同期
    kind: gha
    workflow: zaim-finance-sync.yml
    max_age_h: 30
    owner: 600 リソース・家計
    action: "失敗ログのHTTP状態を確認。402 exceed_egress_quotaならSupabase利用制限、認証失敗時のみZAIMセッションを確認"
  - id: gha_re_inquiry
    label: KURASHIFT 物件問合せ（Tier3）
    kind: gha
    workflow: kurashift-re-daily-inquiry.yml
    max_age_h: 30
    owner: 500 不動産パイプライン
    action: "gh run list -w kurashift-re-daily-inquiry.yml"
  - id: gha_westudy
    label: WeStudy コメント日次取込
    kind: gha
    workflow: westudy-raimo-weekly.yml
    max_age_h: 36
    owner: 315 連携健全性点検
    action: "08:00本番と14:00補欠の失敗ログを確認。402 exceed_egress_quotaならSupabase利用制限を解消後に再実行。ログイン停滞なら時間を置く"
  - id: weekly_review_facts
    label: 314 週次機械チェック
    kind: file_mtime
    glob: .jarvis_state/weekly_review_314/facts_*.md
    max_age_h: 200
    owner: 314 業務品質監査
    action: "launchctl kickstart gui/$(id -u)/com.matsunoma.jarvis.weekly-review-314"
