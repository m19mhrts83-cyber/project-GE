# 家計キヨサキB/S — 分類正本（Read Model 用）
# 象限: income | expense | asset | liability
# counts_toward_total: false → 表示のみ（合計に再加算しない）

version: 1
updated: "2026-08-19"

insurance_pairs:
  - gross_id: sony_life
    loan_id: sony_life_policy_loan
    label: ソニー生命（ネット）
    purpose: property_acquisition
  - gross_id: sony_life_chikage
    loan_id: sony_life_chikage_policy_loan
    label: ソニー生命・千景
    purpose: property_acquisition
  - gross_id: prudential_life
    loan_id: prudential_life_policy_loan
    label: プルデンシャル生命
    purpose: property_acquisition
  - gross_id: prudential_life_chikage
    loan_id: prudential_life_chikage_policy_loan
    label: プルデンシャル・千景
    purpose: property_acquisition

securities:
  - id: sbi_index
    label: SBIインデックス（月9万・寝かせて）
    band: sleep
    note: 事業MQとは別帯。NISA月9万は触らない
  - id: bloomo
    label: Bloomo（衛星）
    band: theme
    note: Themeスリーブ
  - id: akatsuki_bond
    label: あかつきGS劣後債
    band: sleep
    note: 増やさない・売らない
  - id: mhi_stock
    label: 三菱重工持株
    band: sleep

static_rows:
  - id: home
    label: 自宅（住居コスト）
    quadrant: liability
    band: consumer
    counts_toward_total: false
    hint: キヨサキ: 継続してポケットから出る。時価は脚注のみ

loan_match:
  mini_patterns: [MINI, Countryman, マイカー, 名鉄AUTO, mycar]
  mini_label: MINI Countryman D ローン
  home_patterns: [大垣, 共立, 住宅, 自宅, 住居, ogaki]
  home_label: 自宅ローン（大垣共立）
  # 2026年完済予定・家計B/S対象外（日本学生支援機構等）
  exclude_patterns: [奨学金, 日本学生支援, ガクセイシエン, JASSO, 15F]

expense_flow:
  exclude_category_patterns:
    - MQ
    - 不動産
    - 合計
    - "19"
    - 賃貸
    - マンション
    - δ
    - G.ローン借換
    - 奨学金
    - 15F

income_categories:
  - 給与
  - 賞与
  - 三菱重工

# 不動産フロー（家計B/S）。詳細: docs/KURASHIFT_家計BS_不動産フロー.md
realestate_flow:
  income_source: tax_return_then_occupancy
  income_basis: gross_total_rent
  finance_rent_is_net: true
  mgmt_expense: occupancy_mgmt_unfiled_only
  mq_in_totals: false
  other_income_patterns: ["19.2", "19.4", "19.6", "売却"]

policy_loan_rules:
  net_in_total: true
  indent_counts_toward_total: false
