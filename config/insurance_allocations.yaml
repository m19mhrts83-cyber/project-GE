# 生命保険の特別勘定配分・月額積立（KURASHIFT）
# 正本: アクサ = IFA石河さん反映の参考配分。他社は対アクサ比較用。
# 未確認の pct / monthly_yen は null。取得成功で web、失敗時は snap JSON を参照。
#
# 配分・月額 URL の実体は .env.jarvis_private（口座トークン・セッション付きのため Git 非共有）。
# 実装方針: ログイン後に下記 path_hint / screen_code へ遷移。Sony の cid/flashId 直叩きは参考のみ。

reference_account: axa_life

advisor:
  name: 石河旦善
  role: IFA（独立系ファイナンシャルアドバイザー）
  policy: |
    アクサ生命の特別勘定比率は石河さんのアドバイスを反映した正とする。
    ソニー・プルデンシャルも同方針で揃えた。今後の比率変更はまずアクサを更新し、
    他社との差分を /portfolio で確認してから手を動かす。
    【連絡】まず iMessage（IFA_ISHIKAWA_PHONE）。文字数不足ならメールへ。
    詳細: docs/KURASHIFT_検証プラン.md「後回しバックログ B-IFA-1」
  related_accounts:
    - axa_life
    - sony_life
    - sony_life_sovani
    - sony_life_chikage
    - prudential_life
    - prudential_life_chikage

accounts:
  axa_life:
    label: アクサ生命（真治）
    role: reference
    monthly_yen: null
    monthly_source: zaim
    funds: []
    as_of: null
    source: pending
    fetch:
      premium_url_env: AXA_ALLOC_PREMIUM_URL
      account_value_url_env: AXA_ALLOC_ACCOUNT_VALUE_URL
      path_hint:
        - /fund-allocation/premium/
        - /fund-allocation/account-value/
      note: 月額は MyAXA で見つからず。Zaim 入金履歴を正とする（AXA_MONTHLY_SOURCE=zaim）

  sony_life:
    label: ソニー生命（真治・一時払）
    product: 変額確定年金１５年７０歳一時払
    role: compare
    monthly_yen: null
    funds: []
    as_of: null
    source: pending
    note: 月次払込なし。評価は週次スクレイプ。払込累計は公式入金履歴待ち
    fetch:
      alloc_url_env: SONYLIFE_ALLOC_URL_1
      alloc_url_env_alt: SONYLIFE_ALLOC_URL_1B
      monthly_url_env: SONYLIFE_MONTHLY_URL_1
      monthly_url_env_alt: SONYLIFE_MONTHLY_URL_1B
      screen_code_alloc:
        - PYHW0770
        - PYHW0730
      screen_code_monthly:
        - PYHW2410
      note: Seam cid/flashId はセッション切れしやすい。ログイン後に画面コード遷移が本線

  sony_life_sovani:
    label: ソニー生命（真治・SOVANI）
    product: SOVANI（月4,000円）
    role: compare
    monthly_yen: 4000
    funds: []
    as_of: null
    source: pending
    note: 2023-07〜大垣共立32,725円のうち4,000円。一時払とは分けて評価。公式評価は未取得

  sony_life_chikage:
    label: ソニー生命（千景）
    product: 変額確定年金１５年６５歳
    role: compare
    monthly_yen: 28725
    funds: []
    as_of: null
    source: pending
    fetch:
      alloc_url_env: SONYLIFE_ALLOC_URL_2
      monthly_url_env: SONYLIFE_MONTHLY_URL_2
      screen_code_alloc:
        - PYHW0730
      screen_code_monthly:
        - PYHW2410
      note: 真治と同様、cid 直叩きは参考。ログイン後遷移が本線。月額28,725円はZaim大垣共立から切り出し

  sony_life_sovani_kids:
    label: ソニー生命 SOVANI（子ども）
    product: SOVANI（珠己・円香・紗和 各月4,000円）
    role: education_baseline
    monthly_yen: 12000
    funds: []
    as_of: null
    source: pending
    note: |
      教育・資産運用の勉強用。このまま貯め続けた場合の基準値として残す。
      別の使い方・運用に切り替えたときの比較用。成人の対アクサ評価には混ぜない。
      払込は楽天銀行（子ども名義）の月4,000円×3。評価は公式未取得。

  prudential_life:
    label: プルデンシャル生命（真治）
    product: 変額保険(終身型)６５歳払込
    role: compare
    monthly_yen: null
    funds: []
    as_of: null
    source: pending
    note: 評価額は手登録（PRUDENTIAL_VALUE_JPY）。払込は現行月額10,346円（2契約合算）を全期間に適用し、2023-03の有期払込完了分は除外

  prudential_life_chikage:
    label: プルデンシャル生命（千景）
    product: 変額保険(終身型)６５歳払込
    role: compare
    monthly_yen: null
    funds: []
    as_of: null
    source: pending
    note: 評価額は手登録（PRUDENTIAL_CHIKAGE_VALUE_JPY）。払込の切り分けは真治と同じ（2契約合算）
