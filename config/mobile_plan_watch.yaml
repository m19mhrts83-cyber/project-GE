# オプション解約後の想定月額（4回線＋Air・各種割引後の目安）
# 初月は事務手数料込みで高い。2ヶ月目以降の確定月で検証する。
# 初回検証（2026-08-10）: Zaim に 2026-07 以降の携帯行がまだ無い。
#   2026-06 = 41,870円（初月・skip）。内訳: 6/15 ソフトバンクモバイル 21,395円（三井住友PP・旧側最終疑い）
#   + 6/30 ソフトバンクМ 16,074円（PayPay・Y!mobile初月）+ UQ最終 4,400円 + AMEX 1円。
#   expected は見積ベース仮値。7月確定取込後に実測で更新する。
expected_monthly_yen: 13000
warn_over_yen: 3000
# 初月・端末分割等で月額比較から外す YYYY-MM
skip_months:
  - "2026-06"

