# 所有物件レーンの区分（ラベル二軸）。号室はタイトル。Guest用 PM_* とは別レイヤ。
property_labels:
  GrandoleI:
    display: Grandole志賀本通I
    default_pm: ミニテック
    also_pm:
    - LEAF
    - Tcell
    note: 主はミニテック。LEAF・Tcell関与時はボールの社をPMラベルに
  GrandoleII:
    display: Grandole志賀本通II
    default_pm: ホームプランナー
    also_pm: []
    note: ホームプランナーのみ
  キャラメル:
    display: キャラメル
    default_pm: Tcell
    also_pm: []
pm_labels:
  ミニテック:
    folder: 102_ミニテック
  ホームプランナー:
    folder: 101_ホームプランナー
  Tcell:
    folder: 103_Tcell
  LEAF:
    folder: 104_LEAF
# 廃止: LEAF京都（物件ではない。京都銀行の呼称）
#
# 管理会社向け共有（Guest後回し・転送メールは相手に渡さない）
pm_share:
  email_forward_to_partner: false
  footer_max_tasks: 5
  companies:
    ミニテック:
      folder: 102_ミニテック
      pilot: false
      guest_project_url: ""
    ホームプランナー:
      folder: 101_ホームプランナー
      pilot: true
      guest_project_url: ""
    Tcell:
      folder: 103_Tcell
      pilot: false
      guest_project_url: ""
    LEAF:
      folder: 104_LEAF
      pilot: true
      guest_project_url: ""
# GenMail（admin 集約）→ Todoist 提案の入口
