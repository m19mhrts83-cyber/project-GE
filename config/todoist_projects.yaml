# --- 所有物件・区分（2026-09-21 訂正）---
# セクション＝進捗列のまま。物件／管理会社はラベル二軸。号室はタイトルへ。
# 「LEAF京都」は物件ではない（京都銀行呼称）→ 物件ラベルに使わない
# GrandoleI: 主=ミニテック。LEAF・Tcell も関与可（ボールの社をPMラベル）
# GrandoleII: ホームプランナーのみ / キャラメル: Tcellのみ
# タイトル例: [GrandoleI][ミニテック] 202号 水漏れ手配
# 起票: create-task --lane properties --label GrandoleI,ミニテック
# 一覧正本: .jarvis_state/todoist_property_labels.json
# 詳細: docs/Todoist_タスク正本_設計_20260921.md「所有物件の整理」
# Filter案内（Todoist UI・Beginner 3枠・2026-09-21入替）:
#   要連携 = @要Jarvis連携 | @要ボス
#   SecondBrain = @SecondBrain   ← SB/Genspark 起票の見渡し（旧「要ホーク」枠を入替）
#   パッと = @quick
# ※要ホークはラベル運用のまま。専用Filterは Pro で再開可
# ※日本語「完了」はクエリ非対応。未完了のみはフィルター既定のため !完了 不要
# ※「ラベル:A | 要ボス」も OR 右側修飾なしで失敗する → @ 記法を使う
# 朝レビュー順: 要連携 → SecondBrain → パッと → オーナー確認 → その他未着手
