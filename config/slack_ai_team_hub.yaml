# AIエージェントチーム — Slack ハブ（読取・監視用）
# 投稿は既存 Webhook（SLACK_WEBHOOK_AI_TEAM_*）。読取は Cursor Slack MCP 本線。

workspace_hint: aiwsnetwork.slack.com

channels:
  hub:
    id: C0CA3M5SNNS
    slack_name: ai-hub
    purpose: Hawk／FRIDAY／Jarvis／Claude Code 同士の共有・進捗手渡し（人の判断トレイではない）
  consult:
    id: C0C7R0UF3MM
    purpose: 要判断・手渡し（次の担当）・松野の確認トレイ
  report:
    id: C0C866FNU3C
    purpose: 完了・定型報告・松野が流し見する成果
  ops:
    id: C0C88A6CWQH
    purpose: 障害・健全性・枠切れ
  deal:
    id: C0CAJQT7QQY
    slack_name: deal-active
    purpose: "物件進行・deals 活況（114／買い進め等）。Webhook: SLACK_WEBHOOK_AI_TEAM_DEAL_ACTIVE"

# Cursor セッションで優先して読む順（deal は件数多めのため既定は読取対象外）
read_priority:
  - hub
  - consult
  - ops
  - report

# 1回の読取上限（チャンネルごと）
limit_per_channel: 8

# 促しすぎ防止（同一セッション以外でも、同レベル再掲の最短間隔・時間）
min_hours_between_prompts: 4
