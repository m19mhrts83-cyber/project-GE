    can_do: "パートナー連絡の差分取込・要約・#report 材料（送信は人）"
    site_logins:
      - service: Gmail（admin 取込）
        access: API token
        note: token_livingsupport 経由。値はチャット禁止
      - service: Chatwork
        access: API／取込スクリプト
        note: 秘密は jarvis_private
      - service: LINE（グループ）
        access: CHRLINE／公式エクスポート
