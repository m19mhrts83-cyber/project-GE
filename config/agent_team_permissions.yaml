# AIエージェントチーム／Grok Bot — 実行権限・秘密アクセス俯瞰
# 値（パスワード・トークン本文）は書かない。キー名とアクセス種別のみ。
#
# 更新タイミング（必須）:
#   - 社員／Grok Bot を新規追加したとき
#   - サイトへの ID・パスワード／API を渡した・足したとき
#   - CLAUDE.md「## 3. 実行権限」や .env.example を変えたとき
# → 本ファイルを直し → jarvis_agent_team_status_sync.py → agentTeam.json を commit/push
#
# ダッシュ: /agent-team の「権限」タブ
# 人向け: docs/AIエージェントチーム/25_実行権限一覧_20261015.md（sync が再生成可）
# 機密二層: docs/AIエージェントチーム/05_機密とenv二層_20261009.md

updated: "2026-10-15"

defaults:
  ai:
    human_gate: "お金・外に出す・消す"
    secrets_note: "社員 .env は最小セット。マスターは .env.jarvis_private"
  grok:
    secrets_policy: none
    secrets_note: "サイトID／パスワード・APIトークンは持たない。Mac実行・秘密は Jarvis（JarvisBox フォーク）"
    human_gate: "対外送信・金・削除は松野了承／Jarvis ゲート"

# AI社員（agents_registry の id）
# methods は CLAUDE.md §3 から sync が自動抽出。ここは上書き・補足用。
# site_logins: ブラウザ／Playwright 等でログインしうるサービス（値は書かない）
agents:
