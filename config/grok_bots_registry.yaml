pillars:
  - id: jarvis
    name: Jarvis
    role: 右腕（Mac 実行 · Cursor）
    note: Grok 外。松野直属
  - id: hawk
    name: ホークアイ（参謀）
    role: 左腕（Grok 指揮 · 参謀室）
    note: Grok 主入口
  - id: karl
    name: カール
    role: 第三柱（Gemini · Journal 振り返り）
    note: Grok 外

# agents_registry.grok_counterpart → bots[].id の展開
counterpart_aliases:
  hawk: [hawk]
  bucho_re: [bucho_re]
  bucho_re_evening: [bucho_re]
  s1: [s1]
  s3+s5: [s3, s5]
  s7: [s7]
  s10-s13: [s10, s11, s12, s13]
  s2+s4+s9: [s2, s4, s9]
  resource: [resource]
  family: [family]
  coaching: [coaching]
  somu: [somu]

# AI社員 ID → 役割分担1行（16_ より）
role_splits:
  "113": "主はKURASHIFT／部長Daily。Grok部長と弱対応"
  "114": "S1ゲートと重複しやすい。ミックス時は511と役割分担"
  "411": "全Grok inbox／チャンネル要約の入口（比較レーン）"
  "412": "411＋AI社員成果を並べて比較"
  "413": "412の差分から取捨ドラフト"
  "414": "採用結果を Grok outbox へ返送"
  "415": "Todoist／inbox の二重起票・競合監視"
  "511": "Grok=調査・問合せ文案／社員=送信準備・対外了承前の整形"
  "512": "Grok=S5/S3判断／社員=取込・整理・停滞見回り"
  "513": "Grok=判断本文／社員=Obsidian・deals突合"
  "514": "Grok=打診論点／社員=書類・下書き検収（送信は人）"
  "515": "Grok=文案・Canva下準備／社員=Drive・Prompt同期点検"
  "516": "実行=Grok S2/S4/S9（検索・定型送信・mark）／見守り=516（枯渇検知・Drive補給・sync_meta・#report）。定型は都度許可不要・非定型は松野確認。二重実行しない"
  "611": "Grok=制約伝達／社員=週次要約のMac側"
  "711": "Grok=週次評価／社員=Journal材料抽出"
  "712": "Grok=パック利用／社員=材料整形"
  "713": "Grok=振り分け・助言／社員=週次材料整理"

