# WeStudy（神大家 会員サイト）HTML・アセットのバックアップ設定
# スクリプト: scripts/westudy_html_backup.py（手順は scripts/README_westudy_html_backup.md）
#
# 保存先の切り替えは destination だけ直せばよい。
# 運営さんのフォルダに移すときは:
#   - 運営フォルダを Google ドライブ（パソコン版）で同期している → type: local の path を差し替え
#   - 同期していない（共有フォルダIDだけ分かる）            → type: gdrive_api + folder_id
# 一時的な上書きは環境変数 WESTUDY_BACKUP_DEST_TYPE / WESTUDY_BACKUP_DEST_PATH /
# WESTUDY_BACKUP_DEST_FOLDER_ID でもできる（config を書き換えずに試す用）。

destination:
  # local: 同期フォルダ等のローカルパスへ zip を置く / gdrive_api: Drive API で folder_id へアップロード
  type: local
  # 置き先: Drive「217_westudyソースコードバックアップ」(admin@livingsupport-matsu.co.jp)。2026-10-28 松野さん指定
  #   https://drive.google.com/drive/folders/1lpkD9i6WITPr4h74doqT8QtKZk5g9cUf
  path: "~/Library/CloudStorage/GoogleDrive-admin@livingsupport-matsu.co.jp/マイドライブ/217_westudyソースコードバックアップ"
  # gdrive_api のとき使う（上と同じフォルダ。subfolder を書けばその下に自動作成）
  folder_id: "1lpkD9i6WITPr4h74doqT8QtKZk5g9cUf"
  subfolder: ""
  # gdrive_api の OAuth トークン（authorized_user 形式・drive スコープ）。
  # 置き先フォルダに書き込める Google アカウントのものを指定する。
  # 既存の token_google_workspace_estate.json は matsuno.estate@gmail.com・drive.file のため
  # 他人所有フォルダには書けない点に注意（運営フォルダ用は別途トークンを作る）。
  token_path: ""

crawl:
  # 巡回の起点（コースタブ5つ＋フォーラム一覧）
  seeds:
    - https://westudy.co.jp/course/kami-ooyasan-club-start
    - https://westudy.co.jp/course/kami-ooyasan-club
    - https://westudy.co.jp/course/level-up
    - https://westudy.co.jp/course/keisho
    - https://westudy.co.jp/course/group-consulting
    - https://westudy.co.jp/course/kami-ooyasan-club?t=forums
  # この正規表現のどれかに当たる westudy.co.jp 内リンクだけを辿る
  include:
    - '^https://westudy\.co\.jp/course/'
    - '^https://westudy\.co\.jp/lesson/'
    - '^https://westudy\.co\.jp/forum/'
  # 当たったら辿らない（ログアウト・管理画面・フィード・返信フォーム等）
  exclude:
    - 'logout'
    - '/wp-login\.php'
    - '/wp-admin'
    - '/wp-json'
    - '/feed/?'
    - '[?&]replytocom='
    - '[?&](share|print)='
    - '\.(zip|pdf|mp4|mov|m4a|mp3)(\?|$)'
  # 残すクエリ（?t=forums 等のタブ切替）。それ以外のクエリは同一ページ扱いで落とす
  keep_query_keys: [t, paged]
  max_pages: 2000
  # ページ間の待ち秒（WeStudy に負荷をかけない）
  page_delay_sec: 1.0
  # 1ページの読み込み上限（秒）。長いと固まったページで十数分止まる
  page_load_timeout_sec: 30
  # Chrome を N ページごとに作り直す（長時間運転のメモリ肥大で InvalidSessionId になるため）。0 で無効
  restart_browser_every: 40

assets:
  # 取得しないホスト（動画本体・解析タグ等）。iframe 埋め込みは manifest に URL だけ記録する
  skip_hosts:
    - player.vimeo.com
    - vimeo.com
    - i.vimeocdn.com
    - www.youtube.com
    - youtube.com
    - www.googletagmanager.com
    - www.google-analytics.com
    - connect.facebook.net
  # 1ファイルの上限（MB）。超えるものは manifest に記録のみ
  max_asset_mb: 25
  skip_content_types: ["video/", "audio/"]
  asset_delay_sec: 0.1

# レッスン等からリンクされた配布資料（PDF・Excel 等）。westudy.co.jp 内のものだけ取得し、
# 外部（Google ドライブ等）のリンクは manifest の external_documents に URL だけ残す
attachments:
  extensions: [pdf, xlsx, xls, xlsm, docx, doc, pptx, ppt, csv, txt, zip]
  max_mb: 100

# WordPress REST API（/wp-json）で取れる本文データ。別の WordPress へ流し込む際の素材になる。
# 会員ログインで見える範囲のみ。WeStudy 側で閉じていれば manifest に status が残るだけ
wp_json:
  enabled: true
  # 1種類あたりの最大ページ数（100件/ページ）
  max_pages_per_type: 50
  # 取らない種類（量が多い・再現に要らない）
  skip_types: [attachment, wp_block, wp_template, wp_template_part, wp_navigation, wp_font_family, wp_font_face, wp_global_styles, nav_menu_item]
  # 追加で保存する公開ファイル
  extra_paths: [/robots.txt, /wp-sitemap.xml, /sitemap.xml, /sitemap_index.xml]

# 画面キャプチャ（ページ全体の PNG）。見た目の答え合わせ用。フォーラムは量が多いので既定では撮らない
screenshots:
  enabled: true
  # これより縦長は上側だけ撮る（全体を撮ると Chrome が落ちることがある）
  max_height_px: 8000
  include:
    - '^https://westudy\.co\.jp/course/'
    - '^https://westudy\.co\.jp/lesson/'
