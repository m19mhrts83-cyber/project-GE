# KURASHIFT 資金送金アシスト — レール定義（Wave 0）
# 正本: docs/KURASHIFT_送金アシスト_実務者設計_20260814.md
# 秘密はここへ書かない（.env.jarvis_private）

version: 1
dest_whitelist:
  smbc_kariya:
    bank_code: "0009"
    branch_code: "486"  # PERSONAL_BANK_BRANCH_CODE と突合
    account_type: ordinary
    # 口座番号は env PERSONAL_BANK_ACCOUNT のみ。ここには下4桁マスク用の参照だけ
    account_env: PERSONAL_BANK_ACCOUNT
    label: "三井住友銀行 刈谷"

defaults:
  min_interval_sec: 60
  headless: false
  require_terminal_app: true

# Phase1（2026-08 Infinite）目安。money-ops 作成時の初値。
rails:
  - id: sbi_main_smbc
    label: "第一生命NEOBANK本（普通）→SMBC刈谷"
    enabled: true
    order: 10
    amount_jpy: 26000
    keep_floor_jpy: 500800
    from_account_id: sbi_net_main
    to_account_id: smbc_kariya
    # ログインOTPはメール/SMS可。実行承認はスマート認証NEO（アプリ）が多い
    otp_channel: gmail_api
    execute_auth: passkey_or_bio
    gmail_account: m19m
    sender_hint: "ドコモSMTB|住信SBI|ネット銀行|NEOBANK|第一生命|netbk"
    free_rail: true
    cotra_max_jpy: 100000
    runner: sbi_net
    launcher: "215_kamiooya/C1_cursor/browser_automation/run_phase1_sbi_main_to_smbc.sh"
    status_default: pending

  - id: sbi_sub_smbc
    label: "第一生命NEOBANK副→SMBC刈谷"
    enabled: true
    order: 20
    amount_jpy: 161000
    keep_floor_jpy: 81000
    from_account_id: sbi_net_sub
    to_account_id: smbc_kariya
    otp_channel: gmail_api
    execute_auth: passkey_or_bio
    gmail_account: m19m
    sender_hint: "ドコモSMTB|住信SBI|ネット銀行|NEOBANK|第一生命|netbk"
    free_rail: true
    cotra_max_jpy: 100000
    # 161k → ことら 100k + 61k
    cotra_split: [100000, 61000]
    runner: sbi_net
    launcher: "215_kamiooya/C1_cursor/browser_automation/run_phase1_sbi_sub_to_smbc.sh"
    status_default: pending
    # 副がハイブリッド預金の場合、他行送金前に普通へ戻すことがある

  - id: tokairokin_smbc
    label: "東海労金→SMBC刈谷"
    enabled: true
    order: 30
    amount_jpy: 232000
    keep_floor_jpy: 121000
    from_account_id: tokairokin
    to_account_id: smbc_kariya
    otp_channel: app_onetime_pw
    gmail_account: null
    sender_hint: null
    free_rail: false
    runner: tokairokin
    launcher: "215_kamiooya/C1_cursor/browser_automation/run_phase1_tokairokin_to_smbc.sh"
    status_default: pending

  # 注意: MUFG豊明は千景名義のため、真治AWへの口座紐づけ不可。
  # 真治名義の対応銀行＋刈谷の登録は可。千景分は本人AW or IB有料寄せ。
  # 2026-08 サイクル: IB（手数料220）で 290,000 完了。AW ランチャは真治名義口座向けに残置。
  - id: mufg_airwallet
    label: "MUFG豊明（千景）→IB→SMBC刈谷"
    enabled: true
    order: 40
    amount_jpy: 290000
    keep_floor_jpy: 85000
    from_account_id: mufg_toyoake
    to_account_id: smbc_kariya
    otp_channel: app_onetime_pw
    gmail_account: null
    sender_hint: "エアウォレット|COIN|COIN+|三菱UFJ|リクルート"
    free_rail: false
    require_first_arrival_proof: true
    owner_note: "mufg_toyoake=千景名義。真治AW直結不可。今回サイクルはIB有料寄せ（config/kurashift_ib_mufg_chikage.yaml）。"
    runner: ib_assist
    launcher: "215_kamiooya/C1_cursor/browser_automation/run_phase1_airwallet_to_smbc.sh"
    config: config/kurashift_ib_mufg_chikage.yaml
    status_default: pending

  - id: shiga_smbc
    label: "滋賀銀行→SMBC刈谷"
    enabled: true
    order: 50
    amount_jpy: 62000
    keep_floor_jpy: 300000
    from_account_id: shiga
    to_account_id: smbc_kariya
    otp_channel: app_onetime_pw
    runner: ib_assist
    launcher: "215_kamiooya/C1_cursor/browser_automation/run_phase1_shiga_to_smbc.sh"
    config: config/kurashift_ib_shiga.yaml
    status_default: pending
    note: "時間外 BEQB0003 → 翌朝営業時間。完了後 chrome cleanup"

  - id: kyoto_smbc
    label: "京都銀行刈谷→SMBC刈谷"
    enabled: true
    order: 60
    amount_jpy: 50000
    keep_floor_jpy: 51000
    from_account_id: kyoto_kariya
    to_account_id: smbc_kariya
    otp_channel: app_onetime_pw
    runner: ib_assist
    launcher: "215_kamiooya/C1_cursor/browser_automation/run_phase1_kyoto_to_smbc.sh"
    config: config/kurashift_ib_kyoto.yaml
    status_default: pending

blocked:
  - id: paypay_orix_keep
    reason: "ミニテック着金・ORIX keep 前は触らない"
