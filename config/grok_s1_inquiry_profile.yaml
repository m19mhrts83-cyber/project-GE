# S1 問合せフォーム用プロフィール（非秘密）
# パスワード・ログインIDの実体は .env.jarvis_private（PORTAL_LOGIN_* 等）
# 更新: 2026-08-26

version: 1
inquiry_party: personal
owned_properties_mode: aggregate  # 所有物件は合算で記載（法人名義と分けない）

# 表示用の正は PERSONAL_*（jarvis_private）。空のとき Jarvis がそこから読む
fields_from_env:
  display_name: PERSONAL_NAME
  email: PERSONAL_EMAIL
  phone: PERSONAL_PHONE

# サイト別ログインは PORTAL_LOGIN_* を既定。差分があるときだけサイト別キー
portals:
  - id: rakumachi
    label: 楽待
    login_env: [RAKUMACHI_LOGIN_EMAIL, RAKUMACHI_PASSWORD]
    fallback: [PORTAL_LOGIN_EMAIL, PORTAL_LOGIN_PASSWORD]
  - id: kenbiya
    label: 健美家
    login_env: [KENBIYA_LOGIN_EMAIL, KENBIYA_PASSWORD]
    fallback: [PORTAL_LOGIN_EMAIL, PORTAL_LOGIN_PASSWORD]
  - id: homes
    label: HOME'S投資（LIFULL）
    url_hint: https://toushi.homes.co.jp/login/
    login_env: [HOMES_LOGIN_EMAIL, HOMES_PASSWORD]
    fallback: [PORTAL_LOGIN_EMAIL, PORTAL_LOGIN_PASSWORD]
  - id: nagoya_rengo
    label: 名古屋不動産連合隊（表記ゆれ: 連合体）
    url_hint: https://www.rals.net/nagoya
    login_env: [NAGOYA_RENGO_LOGIN_EMAIL, NAGOYA_RENGO_PASSWORD]
    fallback: [PORTAL_LOGIN_EMAIL, PORTAL_LOGIN_PASSWORD]
  - id: athome
    label: at home
    url_hint: https://www.athome.co.jp/login/
    login_env: [ATHOME_LOGIN_EMAIL, ATHOME_PASSWORD]
    fallback: [PORTAL_LOGIN_EMAIL, PORTAL_LOGIN_PASSWORD]
    note: 消費者会員。年収・棟数の会員プロフィール欄なし（問合せ都度）

# 会員プロフィール正本スナップ（ポータル表示用。秘密は env）
profile_snapshot:
  checked_at: "2026-08-27"
  income_band: "1500万円以上（世帯・家賃込み目安／給与税込約1,361万円＋家賃収入欄）"
  own_funds_manyen: 830
  loan_balance_manyen: 16369  # 物件ローン合算（住宅ローン除く・トラッカー）
  owned_apt_buildings: 3  # GrandoleⅠ・Ⅱ・キャラメル（合算）
  owned_units_total: 20
  sources:
    income: jarvis_tax_annual_income.py（令和7年分）
    loans: 240_融資/loan_tracker_export/loans.json
    properties: config/kurashift_re_property_master.yaml

notes:
  - 問合せ名義は個人。所有物件は合算。
  - パスワードを Grok Instructions に書かない。
  - Jarvis がマイページ確認後、S1_PORTAL_PROFILE_CHECKED_AT を更新する。
  - 2026-08-26: 共通PW確定。健美家・楽待ログインOK。at home / 連合隊は続き。
  - 2026-08-26: 健美家・楽待の年収／自己資金／ローン／棟数を最新化（一棟アパート3棟）。
  - 2026-08-26: HOME'S投資 新規登録＋会員情報更新完了（toushi.homes.co.jp）。S1 VM ログイン確認済み。
  - 2026-08-26: at home ログインOK（共通PW）。投資用会員プロフィール（年収・棟数）欄は無し。
  - 2026-08-27: at home 再確認。ATHOME_PASSWORD を PORTAL 共通PWで正本化。 headless は Geetest でログイン画面到達不可。投資用プロフィール欄なしは既存結論を維持。
  - 2026-08-30: 滋賀銀行ルートの探索枠は「個人APあと1棟まで」（家賃＞給与で不可）。ポータル表示の棟数合算（3）と、滋賀枠の数え方は別管理。
