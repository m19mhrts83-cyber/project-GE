# Grok 物件調査 Bot — 優先エリア・ふるい（正本）
# Jarvis property_mail_match の CITY_HINTS / スコアと整合。Bot 説明文は grok_property_report_format.md を参照。

version: 1
updated: "2026-08-30"

priority_areas:
  primary:
    prefectures: [愛知県]
    cities_hint:
      - 名古屋
      - 豊明
      - 岡崎
      - 碧南
      - 知多
      - 安城
      - 豊田
      - 瀬戸
      - 春日井
      - 犬山
      - 一宮
  secondary:
    prefectures: [岐阜県, 三重県]
    cities_hint:
      - 岐阜
      - 各務原
      - 大垣
      - 羽島
      - 桑名
      - 四日市
      - 津
      - 鈴鹿

exclude_default:
  - 東京23区・都心ワンルーム
  - 区分マンション単体
  - 一棟AP（戸建が主線）

property_filter:
  structure: 戸建
  price_man_min: 500
  price_man_max: 3500
  yield_pct_internal_min: 0.15  # Bot 内部目安。地場 outreach 文面では前面に出さない
  land_value100_prefer: true
  parking_bonus: true
  hazard_default: exclude  # OK|注意|除外 — 除外は原則見送り（高利回り例外なし）
  # 耐震（紙屋さん情報 2026-08-29）— 調査で必ず区分。旧耐震だけで除外しない
  seismic_check_required: true
  seismic_new_from: "1981-06-01"  # 建築確認日目安
  # 旧耐震戸建の保険等: 年あたり約10万円級増の運用目安（見積で上書き）
  # 買付交渉（S6）: 保有10年想定で約100万円減額を論点に載せる
  old_seismic_insurance_extra_yen_per_year_hint: 100000
  old_seismic_negotiate_discount_yen_for_10y_hint: 1000000

# S1 自律探索の優先ポータル（5）。ログイン問合せは楽待・健美家を特に優先。
# 詳細ルール: config/grok_property_bot_grok_paste.md
sources:
  - 楽待
  - 健美家（kenbiya.net）
  - LIFULL HOME'S
  - 名古屋不動産連合隊（通称ゆれ: 連合体 / https://www.rals.net/nagoya）
  - at home
  - 健美家メルマガ
  - 地場返信（estate Gmail → property_mail_match 通常ルート）
