notes:
  - Bot Instructions の正本は git-repos/config の paste。このフォルダはキュー・作業 MD 用
  - 日報・[Grok調査] は estate メールのまま。急ぎ任意は [Jarvis依頼]
  - ファイル名: YYYY-MM-DD_題名.md（Jarvis 書込は YYYY-MM-DD_HHMM_題名.md）
  - Grok Drive コネクタは admin。anyone公開は原則しない
