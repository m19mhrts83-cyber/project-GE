name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'shuhen-map.html'
      - 'shuhen-map.js'
      - '.github/workflows/pages-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (docs/ under /docs URL path)
        run: |
          mkdir -p _site/docs
          rsync -a --exclude='.git*' --exclude='mac引き継ぎ.md' docs/ _site/docs/
          if [ -f index.html ]; then
            cp index.html _site/index.html
          fi
          if [ -f app.js ]; then
            cp app.js _site/app.js
          fi
          if [ -f style.css ]; then
            cp style.css _site/style.css
          fi
          if [ -f shuhen-map.html ]; then
            cp shuhen-map.html _site/shuhen-map.html
          fi
          if [ -f shuhen-map.js ]; then
            cp shuhen-map.js _site/shuhen-map.js
          fi
          touch _site/.nojekyll _site/docs/.nojekyll

      - name: Inject Maps browser key into shuhen-map.js
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_MAPS_BROWSER_KEY:-}" ]; then
            echo "Missing GitHub Actions secret: GOOGLE_MAPS_BROWSER_KEY" >&2
            exit 1
          fi
          if [ ! -f _site/shuhen-map.js ]; then
            echo "Missing _site/shuhen-map.js" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("_site/shuhen-map.js")
          key = os.environ["GOOGLE_MAPS_BROWSER_KEY"].strip()
          text = path.read_text(encoding="utf-8")
          # Replace only the const assignment value (keep MAPS_KEY_PLACEHOLDER intact)
          new_text, n = re.subn(
              r"(const EMBEDDED_MAPS_KEY = ')__GOOGLE_MAPS_BROWSER_KEY__(';)",
              lambda m: m.group(1) + key + m.group(2),
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"expected 1 EMBEDDED_MAPS_KEY replacement, got {n}")
          if "const MAPS_KEY_PLACEHOLDER = '__GOOGLE_MAPS_BROWSER_KEY__';" not in new_text:
              raise SystemExit("MAPS_KEY_PLACEHOLDER was altered; abort")
          path.write_text(new_text, encoding="utf-8")
          print("injected maps browser key into EMBEDDED_MAPS_KEY only")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
