name: Vercel Hobby cron check

# Hobby は Cron 日次1回まで。*/5 等を vercel.json に入れるとデプロイ失敗する。
# vercel.json 変更時だけ検査（Vercel 自体には影響しない）。

on:
  push:
    paths:
      - "**/vercel.json"
      - scripts/check_vercel_hobby_crons.py
      - .github/workflows/vercel-hobby-cron-check.yml
  pull_request:
    paths:
      - "**/vercel.json"
      - scripts/check_vercel_hobby_crons.py
      - .github/workflows/vercel-hobby-cron-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject Hobby-disallowed Vercel crons
        run: python3 scripts/check_vercel_hobby_crons.py
