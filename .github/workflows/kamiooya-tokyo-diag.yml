name: kamiooya-tokyo-diag

# 神大家 AI ナビ 東京移設: 切替前の切り分け（2026-11-20）。
# 公開リポなので、秘密の値・応答の中身はログに出さない。出すのは「一致/不一致」と状態コード・エラーコードだけ。
# 1. 関数の秘密: 旧と新で、同じ名前の値が一致するか（API が返す値の要約どうしを比べる）
# 2. 会員登録の経路: 名簿にない架空データ（example.invalid / DIAG-NOT-A-MEMBER）を旧・新の raimo-auth に送り、
#    返るエラーコードを並べる（not_on_roster なら正常。架空データなので登録はされない）

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "東京の ref"
        required: true
        default: "sufbsyddqgekvcgadhpv"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REF: mwubzgefkkjjbingrmqu
      TARGET_REF: ${{ github.event.inputs.target_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_KAMIOOYA }}
    steps:
      - name: Secrets (same value?)
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[a-z0-9]{20}$ ]] || exit 1
          for ref in "$SOURCE_REF" "$TARGET_REF"; do
            curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${ref}/secrets" > "$RUNNER_TEMP/${ref}.json"
          done
          python3 - "$RUNNER_TEMP/${SOURCE_REF}.json" "$RUNNER_TEMP/${TARGET_REF}.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          old = {s["name"]: s.get("value") for s in json.load(open(sys.argv[1]))}
          new = {s["name"]: s.get("value") for s in json.load(open(sys.argv[2]))}
          print("| 秘密 | 旧 | 新 | 値 |\n|---|---|---|---|")
          for n in sorted(set(old) | set(new)):
              if n.startswith("SUPABASE_"):
                  continue  # プロジェクトごとに違うのが正しい
              same = "一致" if n in old and n in new and old[n] == new[n] else ("不一致" if n in old and n in new else "-")
              print(f"| {n} | {'あり' if n in old else 'なし'} | {'あり' if n in new else 'なし'} | {same} |")
          PY
          rm -f "$RUNNER_TEMP"/*.json

      - name: Register path (fake, not on roster)
        run: |
          set -euo pipefail
          echo "| 先 | HTTP | 応答コード | 秒 |" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" | tee -a "$GITHUB_STEP_SUMMARY"
          i=0
          for ref in "$SOURCE_REF" "$TARGET_REF"; do
            i=$((i+1))
            out=$(curl -sS -m 90 -o "$RUNNER_TEMP/r.json" -w '%{http_code} %{time_total}' -X POST \
              "https://${ref}.supabase.co/functions/v1/raimo-auth/auth/register-roster" \
              -H 'Content-Type: application/json' -H 'Origin: https://ma-54t2keqdelz3.raimo-app.buzz' \
              --data "{\"email\":\"diag-tokyo-gha${i}@example.invalid\",\"password_hash\":\"DiagOnly-NotAMember-1\",\"name\":\"診断用\",\"member_no\":\"DIAG-NOT-A-MEMBER\",\"prefecture\":\"\"}" || echo "000 0")
            code=$(jq -r '.errorCode // .error // "（なし）"' "$RUNNER_TEMP/r.json" 2>/dev/null || echo "（読めない）")
            echo "| ${ref} | ${out% *} | ${code} | ${out#* } |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          rm -f "$RUNNER_TEMP/r.json"
