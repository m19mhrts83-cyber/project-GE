# PR 時の loopware 確認（AI 不使用）。loopware に変更があるときだけ動く（2026-11-14 適正化）
name: PR Checks (loopware)

on:
  pull_request:
    paths:
      - "apps/loopware/**"
      - ".github/workflows/pr-loopware.yml"
      - ".github/workflows/_app-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-loopware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_app-build.yml
    with:
      app: loopware
