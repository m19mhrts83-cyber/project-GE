# 315 連携健全性点検係 — 本線は GitHub Actions（日曜 21:00 JST）
#
# 点検3系統:
#   1) WeStudy/GHA … この workflow（--cloud）で本線点検 → #ops
#   2) LINE オプチャ … Mac 専用（日曜 21:45 --remediate-once）
#   3) Gmail OAuth token … Mac 専用（同上。token_*.json。再同意は人）
# cloud では 2)(3) はスキップし、#ops 本文に「Mac 21:45 で補完」と出す。
# 流れ図: docs/AIエージェントチーム/…/315_…/docs/flow-overview.html
name: Ops Health 315

permissions:
  actions: read
  contents: read

on:
  schedule:
    # 毎週 日曜 21:00 JST = 日曜 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch:

concurrency:
  group: ops-health-315
  cancel-in-progress: false

jobs:
  ops-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Slack Incoming Webhook（#ops）。未設定なら投稿スキップで失敗にしない（本文はログ）
      SLACK_WEBHOOK_AI_TEAM_OPS: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_OPS }}
      SLACK_WEBHOOK_AI_TEAM_REPORT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_REPORT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gh CLI deps (none) / ensure state dir
        run: mkdir -p .jarvis_state

      # WeStudy 本線。Gmail token / オプチャ詳細は Mac 21:45（--cloud でスキップ）
      - name: Run 315 ops health (cloud — WeStudy; Gmail/openchat deferred to Mac)
        id: run315
        run: |
          set -euo pipefail
          echo "::notice::315 cloud: WeStudy点検。Gmail token とオプチャは Mac 日曜21:45 --remediate-once"
          POST_FLAG=()
          if [[ -n "${SLACK_WEBHOOK_AI_TEAM_OPS:-}" ]]; then
            POST_FLAG=(--post --mark-checked)
          else
            echo "::warning::SLACK_WEBHOOK_AI_TEAM_OPS 未設定 → Slack未投稿（本文のみ）"
          fi
          python scripts/jarvis_ops_health_315.py --cloud "${POST_FLAG[@]}"
