name: Jarvis Dashboard Lanes

# レーン要約確認 digest（少数 kind=digest）→ cards。機械的大量カードは出さない。
# 委任 Graph（MS_GRAPH_CLIENT_ID + REFRESH_TOKEN + AUTHORITY=consumers）必須。
# refresh 回転後は Mac で: python scripts/jarvis_ms_graph_sync_refresh.py --push-gha


on:
  schedule:
    - cron: "30 21 * * *" # 06:30 JST
  workflow_dispatch:

concurrency:
  group: jarvis-dashboard-lanes
  cancel-in-progress: true

jobs:
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q supabase pyyaml

      - name: Run lanes (Graph required)
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          MS_GRAPH_AUTHORITY: ${{ secrets.MS_GRAPH_AUTHORITY }}
          MS_GRAPH_USER_UPN: ${{ secrets.MS_GRAPH_USER_UPN }}
          MS_GRAPH_DRIVE_ID: ${{ secrets.MS_GRAPH_DRIVE_ID }}
        run: python scripts/jarvis_gha_lanes.py --push
