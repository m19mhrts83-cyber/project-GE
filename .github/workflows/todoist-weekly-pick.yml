name: 今週の9件 — 材料づくり／Todoistへ反映

# snapshot … 日曜 17:00 JST: 先週の結果・残り・候補（入口で残った話題も）とおすすめ9件を作り、
#             sync_meta.weekly_pick_snapshot に置いて #consult に「Nody で開く」
# reflect  … 30分ごと（7:00〜23:30 JST）: Nody /week で確定した割付を Todoist に反映
# 止める: リポジトリ変数 JARVIS_WEEKLY_PICK_DISABLE=1（どちらも止まる）

on:
  schedule:
    - cron: "0 8 * * 0" # 日曜 17:00 JST: snapshot
    - cron: "15,45 22-23,0-14 * * *" # 7:15〜23:45 JST: reflect
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot | reflect"
        required: false
        default: "snapshot"
      notify:
        description: "snapshot で #consult に知らせる"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "DB・Todoist に書かず Slack に出さない"
        required: false
        type: boolean
        default: true

concurrency:
  group: todoist-weekly-pick
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.JARVIS_WEEKLY_PICK_DISABLE != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: snapshot / reflect
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          SLACK_WEBHOOK_AI_TEAM_CONSULT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_CONSULT }}
          LOOPWARE_ACCESS_KEY: ${{ secrets.LOOPWARE_ACCESS_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_NOTIFY: ${{ github.event.inputs.notify }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          MODE="reflect"
          NOTIFY="0"
          if [[ "${SCHEDULE:-}" == "0 8 * * 0" ]]; then MODE="snapshot"; NOTIFY="1"; fi
          if [[ -n "${IN_MODE:-}" ]]; then MODE="$IN_MODE"; NOTIFY="0"; fi
          if [[ "${IN_NOTIFY:-false}" == "true" ]]; then NOTIFY="1"; fi
          ARGS=(--mode "$MODE")
          if [[ "$NOTIFY" != "1" ]]; then ARGS+=(--no-notify); fi
          if [[ "${IN_DRY:-false}" == "true" ]]; then ARGS+=(--dry-run); fi
          python scripts/jarvis_todoist_weekly_pick.py "${ARGS[@]}"
