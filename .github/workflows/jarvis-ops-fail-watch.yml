name: Jarvis Ops Fail Watch

# Vercel / GitHub Actions の Fail を検知 → watch_status（ホームお知らせ）
# 定例は朝1回のみ: Gmail トリアージ（05:00 JST）の末尾で実行。
# 本 workflow は手動（workflow_dispatch）用。昼・夜の定刻は回さない。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Supabase へ書かず判定だけ"
        required: false
        type: boolean
        default: false
      note:
        description: "修正お知らせ文（任意・ホームに載せる）"
        required: false
        default: ""
      autofix:
        description: "要対応なら Cloud Agent 自動起動（失敗時ローカル待ち）"
        required: false
        type: boolean
        default: true

concurrency:
  group: jarvis-ops-fail-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q supabase

      - name: Run ops fail watch
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_REPO_URL: ${{ secrets.CURSOR_CLOUD_REPO_URL }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          NOTE: ${{ github.event.inputs.note || '' }}
          AUTOFIX: ${{ github.event.inputs.autofix || 'true' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$DRY" == "true" ]]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--push)
          fi
          if [[ -n "${NOTE:-}" ]]; then
            ARGS+=(--note "$NOTE")
          fi
          if [[ "$AUTOFIX" == "true" && "$DRY" != "true" ]]; then
            ARGS+=(--autofix)
          fi
          python scripts/jarvis_ops_fail_watch.py "${ARGS[@]}"
