name: Trade Desk weekly (cloud)

# ログインサイトは触らない。Yahoo 日足・Tavily・既存スナップからの週次レビューのみ。
# ソニー／アクサ／SBI／あかつきは Mac launchd（portfolio-weekly）。

on:
  schedule:
    - cron: "15 0 * * 0" # 日曜 09:15 JST
  workflow_dispatch:
    inputs:
      skip_tavily:
        description: "Tavily をスキップ"
        required: false
        type: boolean
        default: false

concurrency:
  group: trade-desk-weekly
  cancel-in-progress: true

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q supabase pyyaml

      - name: Weekly cloud ingest
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SKIP_TAVILY: ${{ github.event.inputs.skip_tavily || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${JARVIS_SUPABASE_URL:-}" || -z "${JARVIS_SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "Secrets missing: JARVIS_SUPABASE_*"
            exit 1
          fi
          ARGS=()
          if [[ "$SKIP_TAVILY" == "true" ]]; then
            ARGS+=(--skip-tavily)
          fi
          # キー無しでも ingest 側がキャッシュ／既存DBで続ける（オフライン可）
          python scripts/jarvis_trade_weekly_cloud.py "${ARGS[@]}"
