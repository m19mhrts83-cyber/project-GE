name: Todoist片付け — 材料づくり／Nody判断の反映

# Nody /313/bulk で選んだ「完了／削除／日を変える」を Todoist に反映し、候補の材料を更新する。
# 30分ごと（7:05〜23:35 JST）。勝手に閉じない: 反映は松野さんが選んだ判断だけ。
# 止める: リポジトリ変数 JARVIS_TODOIST_CLEANUP_DISABLE=1

on:
  schedule:
    - cron: "5,35 22-23,0-14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB・Todoist・Slack に書かない"
        required: false
        type: boolean
        default: true

concurrency:
  group: todoist-cleanup-bulk
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.JARVIS_TODOIST_CLEANUP_DISABLE != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: reflect / snapshot
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          SLACK_WEBHOOK_AI_TEAM_CONSULT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_CONSULT }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${IN_DRY:-false}" == "true" ]]; then ARGS+=(--dry-run); fi
          python scripts/jarvis_todoist_cleanup_bulk.py --mode reflect "${ARGS[@]}"
          python scripts/jarvis_todoist_cleanup_bulk.py --mode snapshot "${ARGS[@]}"
