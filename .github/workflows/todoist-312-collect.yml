name: 312 Todoist起票整理 — 起こりを拾う／Todoistへ反映

# collect … 月・水・金 20:30 JST: Slack の松野さんの発言から『起こり』を拾い、Nody（/312）のお題にして #consult に1通
# reflect … 30分ごと（7:00〜24:00 JST）: Nody で「既存タスクへ追記」「別タスクを作る」を選んだものだけ Todoist へ
# 止める: リポジトリ変数 JARVIS_TODOIST_312_COLLECT_DISABLE=1（collect の #consult 投稿だけ止める）
# 台帳（comm_items）から拾う: リポジトリ変数 JARVIS_312_COMM_MAX（未設定・0＝止め。お試しは 5。水曜の回だけ拾う）

on:
  schedule:
    - cron: "30 11 * * 1,3,5" # 月・水・金 20:30 JST: collect
    - cron: "*/30 22-23,0-14 * * *" # 7:00〜23:30 JST: reflect
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | reflect"
        required: false
        default: "collect"
      hours:
        description: "collect: 何時間さかのぼるか"
        required: false
        default: "96"
      dry_run:
        description: "DB に書かず Slack に出さない"
        required: false
        type: boolean
        default: true

concurrency:
  group: todoist-312-collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 312 collect / reflect
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          SLACK_WEBHOOK_AI_TEAM_CONSULT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_CONSULT }}
          SLACK_WEBHOOK_AI_TEAM_REPORT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_REPORT }}
          LOOPWARE_ACCESS_KEY: ${{ secrets.LOOPWARE_ACCESS_KEY }}
          JARVIS_TODOIST_312_COLLECT_DISABLE: ${{ vars.JARVIS_TODOIST_312_COLLECT_DISABLE }}
          COMM_MAX: ${{ vars.JARVIS_312_COMM_MAX }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_HOURS: ${{ github.event.inputs.hours }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          MODE="reflect"
          if [[ "${SCHEDULE:-}" == "30 11 * * 1,3,5" ]]; then MODE="collect"; fi
          if [[ -n "${IN_MODE:-}" ]]; then MODE="$IN_MODE"; fi
          ARGS=(--mode "$MODE")
          if [[ -n "${IN_HOURS:-}" ]]; then ARGS+=(--hours "$IN_HOURS"); fi
          if [[ "${IN_DRY:-false}" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "$MODE" == "collect" && -n "${COMM_MAX:-}" ]]; then ARGS+=(--comm-max "$COMM_MAX"); fi
          python scripts/jarvis_todoist_312_collect.py "${ARGS[@]}"
