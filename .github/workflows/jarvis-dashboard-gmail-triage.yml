name: Jarvis Dashboard Gmail Triage

# 05:00 JST:
#   1) admin general → triage_items
#   2) パートナー Gmail → OneDrive 5.やり取り.md（Graph）＋既読
#   3) パートナー Gmail 未返信判定 → triage_items
# LINE / iMessage / CHRLINE は Mac 残。
# 末尾で Ops Fail Watch（Vercel/GHA）も朝1回だけ実行する。

on:
  schedule:
    - cron: "0 20 * * *" # 05:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Supabase / OneDrive へ書かず候補数だけ出す"
        required: false
        type: boolean
        default: false
      limit:
        description: "最大スレッド数（general / partner 共通上限の目安）"
        required: false
        default: "20"
      skip_partner:
        description: "パートナー MD・判定をスキップ（general のみ）"
        required: false
        type: boolean
        default: false

concurrency:
  group: jarvis-dashboard-gmail-triage
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -q google-api-python-client google-auth-httplib2 google-auth-oauthlib supabase pyyaml

      - name: Materialize Gmail credentials
        env:
          GMAIL_CREDENTIALS_B64: ${{ secrets.GMAIL_CREDENTIALS_B64 }}
          GMAIL_ADMIN_TOKEN_B64: ${{ secrets.GMAIL_ADMIN_TOKEN_B64 }}
        run: |
          set -euo pipefail
          CRED_DIR="${{ github.workspace }}/.credentials"
          MANUAL="${{ github.workspace }}/215_kamiooya/C1_cursor/1b_Cursorマニュアル"
          mkdir -p "$CRED_DIR"
          if [[ -z "${GMAIL_CREDENTIALS_B64:-}" || -z "${GMAIL_ADMIN_TOKEN_B64:-}" ]]; then
            echo "::error::Need GMAIL_CREDENTIALS_B64 and GMAIL_ADMIN_TOKEN_B64"
            exit 1
          fi
          echo "$GMAIL_CREDENTIALS_B64" | base64 -d > "$CRED_DIR/credentials.json"
          echo "$GMAIL_ADMIN_TOKEN_B64" | base64 -d > "$CRED_DIR/token_admin.json"
          cp "$CRED_DIR/credentials.json" "$MANUAL/credentials.json"
          cp "$CRED_DIR/token_admin.json" "$MANUAL/token_livingsupport.json"
          test -s "$CRED_DIR/credentials.json"
          test -s "$CRED_DIR/token_admin.json"

      - name: Run Gmail general triage
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_CREDENTIALS_PATH: ${{ github.workspace }}/.credentials/credentials.json
          GMAIL_ADMIN_TOKEN_PATH: ${{ github.workspace }}/.credentials/token_admin.json
          LIMIT: ${{ github.event.inputs.limit || '20' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(--limit "$LIMIT")
          if [[ "$DRY" == "true" ]]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--push)
          fi
          python scripts/jarvis_gha_gmail_triage.py "${ARGS[@]}"

      - name: Partner Gmail → OneDrive MD (Graph)
        if: ${{ github.event.inputs.skip_partner != 'true' }}
        env:
          GMAIL_CREDENTIALS_PATH: ${{ github.workspace }}/.credentials/credentials.json
          GMAIL_ADMIN_TOKEN_PATH: ${{ github.workspace }}/.credentials/token_admin.json
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          MS_GRAPH_AUTHORITY: ${{ secrets.MS_GRAPH_AUTHORITY }}
          MS_GRAPH_USER_UPN: ${{ secrets.MS_GRAPH_USER_UPN }}
          MS_GRAPH_DRIVE_ID: ${{ secrets.MS_GRAPH_DRIVE_ID }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/215_kamiooya/C1_cursor/1b_Cursorマニュアル
        run: |
          set -euo pipefail
          if [[ -z "${MS_GRAPH_REFRESH_TOKEN:-}" && -z "${MS_GRAPH_CLIENT_SECRET:-}" ]]; then
            echo "::warning::MS_GRAPH_* missing — skip partner yoritoori"
            exit 0
          fi
          ARGS=(--limit "$LIMIT")
          if [[ "$DRY" == "true" ]]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--apply)
          fi
          python scripts/jarvis_gha_partner_gmail_yoritoori.py "${ARGS[@]}"

      - name: Partner Gmail unreplied → triage_items
        if: ${{ github.event.inputs.skip_partner != 'true' }}
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          MS_GRAPH_AUTHORITY: ${{ secrets.MS_GRAPH_AUTHORITY }}
          MS_GRAPH_USER_UPN: ${{ secrets.MS_GRAPH_USER_UPN }}
          MS_GRAPH_DRIVE_ID: ${{ secrets.MS_GRAPH_DRIVE_ID }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          if [[ -z "${MS_GRAPH_REFRESH_TOKEN:-}" && -z "${MS_GRAPH_CLIENT_SECRET:-}" ]]; then
            echo "::warning::MS_GRAPH_* missing — skip partner triage"
            exit 0
          fi
          ARGS=(--limit "$LIMIT")
          if [[ "$DRY" == "true" ]]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--push)
          fi
          python scripts/jarvis_gha_partner_triage.py "${ARGS[@]}"

      - name: Ops fail watch (Vercel / GHA) + autofix
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_REPO_URL: ${{ secrets.CURSOR_CLOUD_REPO_URL }}
        run: |
          set -euo pipefail
          python scripts/jarvis_ops_fail_watch.py --push --autofix
