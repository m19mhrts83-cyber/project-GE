name: kamiooya-tokyo-copy

# 神大家 AI ナビ（kamiooya-qa）を東京の新プロジェクトへ写す（2026-11-20）。
# 手順書: https://claude.ai/artifact/LcNjcVb4GxC4yLX187GEqa
# 公開リポなので、ログに中身・鍵を出さない。写しのファイルは runner の一時領域だけに置き、Artifact に上げない。
# 旧（ムンバイ）は読むだけ。書き込むのは target_ref だけで、旧 ref を書き込み先にすることはできない。

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "写し先（東京）の ref"
        required: true
        default: "sufbsyddqgekvcgadhpv"
      stages:
        description: "schema,data,storage,functions,verify のうち実行するもの（カンマ区切り）"
        required: true
        default: "verify"

permissions:
  contents: read

concurrency:
  group: kamiooya-tokyo-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_REF: mwubzgefkkjjbingrmqu
      TARGET_REF: ${{ github.event.inputs.target_ref }}
      STAGES: ${{ github.event.inputs.stages }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_KAMIOOYA }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::target_ref の形式が違います"; exit 1; }
          [[ "$TARGET_REF" != "$SOURCE_REF" ]] || { echo "::error::旧プロジェクトを書き込み先にはできません"; exit 1; }
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error::secrets.SUPABASE_ACCESS_TOKEN_KAMIOOYA がありません"; exit 1; }
          for ref in "$SOURCE_REF" "$TARGET_REF"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${ref}")
            echo "project ${ref}: HTTP ${code}"
            [[ "$code" == "200" ]] || exit 1
          done

      - name: Install psql 17
        if: ${{ contains(github.event.inputs.stages, 'schema') || contains(github.event.inputs.stages, 'data') }}
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get -qq install -y postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Connections (temporary login roles)
        if: ${{ contains(github.event.inputs.stages, 'schema') || contains(github.event.inputs.stages, 'data') }}
        run: |
          set -euo pipefail
          for side in SOURCE TARGET; do
            ref="${side}_REF"; ref="${!ref}"
            role_json=$(curl -sS -X POST -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
              --data '{"read_only": false}' "https://api.supabase.com/v1/projects/${ref}/cli/login-role")
            role=$(jq -r '.role // empty' <<<"$role_json"); pass=$(jq -r '.password // empty' <<<"$role_json")
            [[ -n "$role" && -n "$pass" ]] || { echo "::error::${side} の一時ログインを作れませんでした"; exit 1; }
            echo "::add-mask::${pass}"
            host=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${ref}/config/database/pooler" | jq -r '[.[] | select(.database_type=="PRIMARY")][0].db_host // empty')
            [[ -n "$host" ]] || { echo "::error::${side} の接続先が取れませんでした"; exit 1; }
            enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$pass")
            echo "::add-mask::${enc}"
            echo "${side}_DB=postgresql://${role}.${ref}:${enc}@${host}:5432/postgres?sslmode=require" >> "$GITHUB_ENV"
          done

      - name: Schema (public)
        if: ${{ contains(github.event.inputs.stages, 'schema') }}
        run: |
          set -euo pipefail
          B=/usr/lib/postgresql/17/bin
          n=$($B/psql "$TARGET_DB" -tAq -c "select count(*) from pg_tables where schemaname='public'")
          [[ "$n" == "0" ]] || { echo "::error::写し先の public に表が ${n} 本あります（構造の写しは空のときだけ）"; exit 1; }
          $B/pg_dump "$SOURCE_DB" --role=postgres --schema-only --schema=public --no-owner --quote-all-identifiers -f "$RUNNER_TEMP/schema.sql"
          # public スキーマ自体は既にあるので CREATE SCHEMA だけ外す
          sed -i -E '/^CREATE SCHEMA "public";$/d' "$RUNNER_TEMP/schema.sql"
          # Supabase 管理用ロール（supabase_admin）の既定権限は写し先で変えられないので外す（新プロジェクトに同じ既定が最初からある）
          sed -i -E '/^ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin"/d' "$RUNNER_TEMP/schema.sql"
          $B/psql "$TARGET_DB" -q -v ON_ERROR_STOP=1 --single-transaction -c "SET ROLE postgres" -f "$RUNNER_TEMP/schema.sql" >/dev/null
          rm -f "$RUNNER_TEMP/schema.sql"
          echo "public: $($B/psql "$TARGET_DB" -tAq -c "select count(*) from pg_tables where schemaname='public'") tables, $($B/psql "$TARGET_DB" -tAq -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'") functions"

      - name: Data (public)
        if: ${{ contains(github.event.inputs.stages, 'data') }}
        run: |
          set -euo pipefail
          B=/usr/lib/postgresql/17/bin
          # 写し先の public の表を空にしてから入れ直す（何度でもやり直せる。旧側には触れない）
          tables=$($B/psql "$TARGET_DB" -tAq -c "select string_agg(format('%I.%I',schemaname,tablename), ',') from pg_tables where schemaname='public'")
          [[ -n "$tables" ]] || { echo "::error::写し先に表がありません。先に schema を実行してください"; exit 1; }
          $B/pg_dump "$SOURCE_DB" --role=postgres --data-only --schema=public --no-owner -Fc -f "$RUNNER_TEMP/data.dump"
          echo "dump: $(du -h "$RUNNER_TEMP/data.dump" | cut -f1)"
          $B/pg_restore --data-only --no-owner -f "$RUNNER_TEMP/data.sql" "$RUNNER_TEMP/data.dump"
          rm -f "$RUNNER_TEMP/data.dump"
          $B/psql "$TARGET_DB" -q -v ON_ERROR_STOP=1 --single-transaction \
            -c "SET ROLE postgres" \
            -c "SET session_replication_role = replica" \
            -c "TRUNCATE ${tables} RESTART IDENTITY CASCADE" \
            -f "$RUNNER_TEMP/data.sql" >/dev/null
          rm -f "$RUNNER_TEMP/data.sql"
          echo "data: loaded"

      - uses: actions/setup-python@v5
        if: ${{ contains(github.event.inputs.stages, 'storage') || contains(github.event.inputs.stages, 'verify') }}
        with:
          python-version: "3.12"

      - name: Service keys
        if: ${{ contains(github.event.inputs.stages, 'storage') || contains(github.event.inputs.stages, 'verify') }}
        run: |
          set -euo pipefail
          for side in SOURCE TARGET; do
            ref="${side}_REF"; ref="${!ref}"
            key=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true" \
              | jq -r '[.[] | select(.name=="service_role")][0].api_key // empty')
            [[ -n "$key" ]] || { echo "::error::${side} の service_role 鍵が取れませんでした"; exit 1; }
            echo "::add-mask::${key}"
            echo "${side}_KEY=${key}" >> "$GITHUB_ENV"
          done

      - name: Storage objects
        if: ${{ contains(github.event.inputs.stages, 'storage') }}
        run: |
          pip -q install requests
          python scripts/kamiooya_storage_copy.py \
            --source "https://${SOURCE_REF}.supabase.co" --target "https://${TARGET_REF}.supabase.co"

      - name: Edge Functions
        if: ${{ contains(github.event.inputs.stages, 'functions') }}
        working-directory: apps/kamiooya-qa-web
        run: |
          set -euo pipefail
          for fn in semantic-search qa-analytics qa-search-log raimo-auth community-attachments srt-ingest; do
            npx --yes supabase@2 functions deploy "$fn" --project-ref "$TARGET_REF" --no-verify-jwt --use-api >/dev/null
            echo "deployed $fn"
          done
          # 関数の秘密は値を読み出せないので、名前だけ並べて足りないものを示す
          old=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${SOURCE_REF}/secrets" | jq -r '.[].name' | sort)
          new=$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${TARGET_REF}/secrets" | jq -r '.[].name' | sort)
          missing=$(comm -23 <(echo "$old") <(echo "$new") | grep -v '^SUPABASE_' || true)
          echo "写し先に無い関数の秘密（名前のみ）:"; echo "${missing:-（なし）}"
          { echo "### 写し先に無い関数の秘密（名前のみ）"; echo '```'; echo "${missing:-（なし）}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (counts only)
        if: ${{ contains(github.event.inputs.stages, 'verify') }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://${SOURCE_REF}.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$SOURCE_KEY" \
            python scripts/kamiooya_cutover_check.py snapshot --out "$RUNNER_TEMP/old.json"
          SUPABASE_URL="https://${TARGET_REF}.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$TARGET_KEY" \
            python scripts/kamiooya_cutover_check.py snapshot --out "$RUNNER_TEMP/new.json"
          python scripts/kamiooya_cutover_check.py compare "$RUNNER_TEMP/old.json" "$RUNNER_TEMP/new.json" | tee -a "$GITHUB_STEP_SUMMARY"
