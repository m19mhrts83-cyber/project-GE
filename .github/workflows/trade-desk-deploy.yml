name: Trade Desk deploy

# KURASHIFT (apps/trade-desk) — main への push で本番デプロイ。
# 手動: gh workflow run trade-desk-deploy.yml
# ローカル代替: scripts/vercel_trade_desk_deploy.sh

on:
  push:
    branches: [main]
    paths:
      - "apps/trade-desk/**"
      - "scripts/vercel_trade_desk_deploy.sh"
      - ".github/workflows/trade-desk-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trade-desk-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_NJph8Tc5cSqw7rZSrPOQMp00
      VERCEL_PROJECT_ID: prj_FoZQmiplAx31rMNxS7sodjYubyto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/trade-desk/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://jarvis-trade-desk.vercel.app
          NEXT_PUBLIC_DASHBOARD_URL: https://jarvis-dashboard-amber.vercel.app

      - name: Deploy to Production
        id: deploy
        run: |
          set -euo pipefail
          # Hobby の日次100件（api-deployments-free-per-day）はコード失敗ではない。
          # 本番は直前の成功デプロイのままにし、ジョブは赤にしない（約24時間後に再実行）。
          set +e
          OUT="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [[ "$CODE" -ne 0 ]]; then
            if echo "$OUT" | grep -q 'api-deployments-free-per-day'; then
              echo "::warning title=Vercel Hobby daily cap::本番デプロイを見送りました。1日100件の上限（api-deployments-free-per-day）で、ビルド失敗ではありません。本番は直前の成功デプロイのままです。約24時間後にこの workflow を再実行すると載ります。"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                {
                  echo "### デプロイ見送り（Vercel Hobby 日次上限）"
                  echo "ビルドは成功。\`vercel deploy\` が api-deployments-free-per-day（1日100件超）で拒否されました。"
                  echo "本番は直前の成功デプロイのままです。約24時間後に再実行してください。"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            exit "$CODE"
          fi
          URL="$(echo "$OUT" | grep -Eo 'https://jarvis-trade-desk[^ ]+\.vercel\.app' | head -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [[ -n "$URL" ]]; then
            vercel alias set "$URL" jarvis-trade-desk.vercel.app --token="$VERCEL_TOKEN"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
