# パートナー連絡整理係（111）昼枠
# 11:50 JST: Gmail＋Chatwork → 5.やり取り.md → 更新時のみ Slack #report
#
# 朝の triage（05:00）とは別。初回は workflow_dispatch で確認してから schedule 運用。

name: Jarvis Partner Day Report (111)

on:
  schedule:
    - cron: "50 2 * * *" # 11:50 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "OneDrive 書込なし・Slack も dry-run"
        required: false
        type: boolean
        default: false
      skip_slack:
        description: "取込のみ（Slack 投稿しない）"
        required: false
        type: boolean
        default: false
      limit:
        description: "Gmail 最大スレッド数"
        required: false
        default: "40"

concurrency:
  group: jarvis-partner-day-report
  cancel-in-progress: true

jobs:
  day-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -q google-api-python-client google-auth-httplib2 google-auth-oauthlib \
            supabase pyyaml requests msal

      - name: Day pipeline (Gmail+CW → Slack if updates)
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
          JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          MS_GRAPH_AUTHORITY: ${{ secrets.MS_GRAPH_AUTHORITY }}
          MS_GRAPH_USER_UPN: ${{ secrets.MS_GRAPH_USER_UPN }}
          MS_GRAPH_DRIVE_ID: ${{ secrets.MS_GRAPH_DRIVE_ID }}
          SLACK_WEBHOOK_AI_TEAM_REPORT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_REPORT }}
          SLACK_WEBHOOK_AI_TEAM_CONSULT: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_CONSULT }}
          SLACK_WEBHOOK_AI_TEAM_OPS: ${{ secrets.SLACK_WEBHOOK_AI_TEAM_OPS }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_SLACK: ${{ github.event.inputs.skip_slack || 'false' }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/215_kamiooya/C1_cursor/1b_Cursorマニュアル
        run: |
          set -euo pipefail
          if [[ -z "${MS_GRAPH_REFRESH_TOKEN:-}" && -z "${MS_GRAPH_CLIENT_SECRET:-}" ]]; then
            echo "::warning::MS_GRAPH_* missing — abort day pipeline"
            exit 0
          fi
          ARGS=(--frame day --limit "$LIMIT")
          if [[ "$DRY" == "true" ]]; then
            ARGS+=(--dry-run-slack)
          else
            ARGS+=(--apply)
            if [[ "$SKIP_SLACK" != "true" ]]; then
              ARGS+=(--push)
            fi
          fi
          python scripts/jarvis_partner_day_pipeline.py "${ARGS[@]}"
