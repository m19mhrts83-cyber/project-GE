# 補欠 schedule ガード（reusable）
#
# サイト側の一時的な停滞（ログイン timeout 等）で落ちやすいジョブは、本番 cron の数時間後に
# 「補欠」cron を足す。補欠の回は、直近 N 時間に成功した実行があれば skip=true を返す。
# → 本番が成功した週（日）は何もしない／失敗した時だけもう一度走る。AI なし。
#
# 使い方（呼び出し側）:
#   jobs:
#     guard:
#       uses: ./.github/workflows/_success-guard.yml
#       with: { window_hours: 30 }
#       permissions: { actions: read }
#     main:
#       needs: guard
#       if: needs.guard.outputs.skip != 'true'
name: _success-guard

on:
  workflow_call:
    inputs:
      window_hours:
        type: number
        required: false
        default: 20
    outputs:
      skip:
        value: ${{ jobs.check.outputs.skip }}

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WINDOW_H: ${{ inputs.window_hours }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "schedule" ]]; then
            echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          wf_path="${GITHUB_WORKFLOW_REF%@*}"
          wf_file="${wf_path##*/}"
          since="$(date -u -d "-${WINDOW_H} hours" +%Y-%m-%dT%H:%M:%SZ)"
          n="$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf_file" -L 20 \
                --json createdAt,conclusion \
                --jq "[.[] | select(.createdAt >= \"$since\") | select(.conclusion == \"success\")] | length" \
                || echo 0)"
          if [[ "${n:-0}" -gt 0 ]]; then
            echo "::notice::${WINDOW_H}h 以内に成功済み（${n} 件）→ 補欠 schedule は skip"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
