# PR 時の trade-desk 確認（AI 不使用）。trade-desk に変更があるときだけ動く（2026-11-14 適正化）
name: PR Checks (trade-desk)

on:
  pull_request:
    paths:
      - "apps/trade-desk/**"
      - ".github/workflows/pr-trade-desk.yml"
      - ".github/workflows/_app-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-trade-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_app-build.yml
    with:
      app: trade-desk
