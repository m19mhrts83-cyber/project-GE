# PR 時の自動チェック（AI 不使用）。2026-10-24 Miss Lemon 起案
# 2026-11-14 適正化: ここは scripts/tests（Python）だけ。アプリと神大家 Q&A は変更があるときだけ動く別ワークフロー
#   pr-jarvis-dashboard.yml / pr-trade-desk.yml / pr-loopware.yml（_app-build.yml を呼ぶ）/ pr-kamiooya-qa.yml
#   これまでは scripts だけの PR でも 6 ジョブ（1 回約 9 分）動いていた
name: PR Checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "line_unofficial_poc/**"
      - "launchd/openchat_md_db_sync_runner.sh"
      - ".github/workflows/pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/pr-checks.yml
      # Dashboard投影・Gmail処理の純粋関数テストもモジュールをimportする。
      - run: pip install requests pyyaml supabase google-api-python-client python-dotenv pillow
      # オプチャ常駐監視のランナー（launchd/open_chat_watch_runner.sh）は Mac の zsh 前提。テストで実際に動かすため入れる
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: python -m unittest discover -s scripts/tests -v
